# config/score.yaml — the v27 score layer's declarative contract (ADR-0011,
# amended v27.1, v28, v28.1 and v28.2).
#
# WHAT THIS IS: the project's FIRST AND ONLY derived product — two composite
# scores per country-year, "official" (canonical-tier sources) and "modelled"
# (widest-coverage single source per component), built ON TOP of the frozen
# indicator dist (data/dist/indicators/*.json), never inside it. The three
# prohibitions stand at the indicator layer; the score DERIVES openly from
# what the indicators measured, and every output file carries derived: true.
#
# WHAT LIVES HERE: intent — directions, transforms, sex handling, which
# score a component enters, the BASIS of each value judgment (mandatory and
# emitted: a boolean higher_is_better hid them), the corpus_metric each
# component's todd-preset weight reads, and max_age_years (decision 16, v28:
# how long a real observation may be carried forward). The NUMBERS never
# live here: bounds, floors and chosen sources are FROZEN by
# scripts/freeze_score_bounds.py into config/score_bounds.yaml (a later fetch
# cannot move the scale; changing bounds = a deliberate regeneration +
# bounds_version bump, and rebuild fails loudly on EITHER drift trigger:
# the frozen source NAME no longer matching the §4.4 selection, or the
# bounds sample's n_sample / n_entities moving beyond bounds_drift_tolerance
# — decision 18, v28.2).
#
# DECISIONS (Ediz's, ADR-0011 §Decision): one source per component for all
# countries and years, never mixed within a component; absolute scale with
# fixed p1/p99 bounds (frozen, versioned; log for the very skewed); the
# fertility target 2.1; coverage 0.60; delta needs 0.50 common weight
# computed on components whose UNDERLYING OBSERVATION differs between the
# two dates (v28 amendment — same-observation components would damp the
# delta artificially); road mortality per-vehicle enters the official score
# only (no world-wide source exists); gini_index is REMOVED FROM THE SCORE
# ONLY (double counting with top_income_share over the shared survey
# universe — it stays an indicator, todd_core true, on the site); sex: the
# life expectancy pair splits male/female as two half-weight components (no
# both-sexes canonical is ever derived in the indicator layer).
#
# THE CARRY RULE (decision 16, v28 — amends decision 3): no interpolation;
# real observations may be carried forward for at most max_age_years, with
# their age recorded and displayed. A component's value for year Y is the
# LATEST real observation with obs_year in [Y - max_age_years, Y]; age =
# Y - obs_year (0 = fresh); a value: null point never counts; nothing is
# carried across entities, sources or sexes; no score year beyond the
# score's max_obs_year (the greatest year with a real observation in any
# retained source of that score); a country-year is scored only with at
# least one FRESH component (the ghost guard). max_age_years: 0 reproduces
# the v27 exact-year behaviour (a tested configuration).
#
# Excluded by later decisions (refused loudly by the schema, never
# silently dropped): incarceration_rate (decision 11, v27.1 — no
# defensible monotone direction: the prison population measures policing
# and the justice system, not crime or well-being; it stays an indicator,
# todd_core true, on the site), maternal_deaths (a count — the ratio is the
# component), the markers, male_height_trend,
# consanguineous_marriage_rate, crude_birth_rate, road_accident_mortality
# (per capita), and the v26-withdrawn immigration_stock /
# agricultural_employment_share. OFFICIAL-SCORE-ONLY by decision 15 (v28):
# illegitimate_births (refused in the modelled score — see its component
# comment).

version: "1"
bounds_from_year: 1990
percentiles: [0.01, 0.99]
coverage_threshold: 0.60
delta_min_common_weight: 0.50
fertility_target: 2.1
rounding: 2
presets: [equal, todd]
# decision 16 (v28): carry a real observation forward at most this many
# years (age recorded, displayed; 0 = the v27 exact-year behaviour).
max_age_years: 3
# decision 18 (v28.2): the drift guard's refusal threshold. At rebuild,
# every frozen block's n_sample and n_entities (the bounds sample's size
# and distinct-entity count, recorded by the freezer) are recomputed live
# with the freezer's own sampling rule; a drift beyond this FRACTION on
# either measure refuses the build. Calibration: a normal yearly refresh
# adds roughly 3% to a 30-year sample — 0.25 tolerates several years of
# refreshes and would have refused the v28.1 wiring (the DYB door moved
# the official fertility sample +97% observations / ~+275% entities under
# the same 'canonical' name, and the name-only guard stayed silent).
bounds_drift_tolerance: 0.25

components:
  # THE TARGET COMPONENT: fertility's optimum is 2.1 (replacement), best = 0
  # distance. t = abs(ln(TFR/2.1)); a non-positive TFR point is unavailable.
  # Known simplification (recorded in ADR-0011): replacement is higher where
  # mortality is high.
  - indicator: birth_rate_fertility
    direction: target
    transform: target
    sex_mode: both
    scores: [official, modelled]
    basis: todd
    provisional: false
    corpus_metric: birth_rate_fertility
    # decision 13 (v28): the 2.1 target is confirmed in the books — too
    # high and too low are BOTH bad; transform and bounds unchanged.

  # THE LOG COMPONENTS (auditor's delegated decisions, skewness > 3 in at
  # least one score, p99/p1 ratios of 25x and more): infant mortality,
  # homicide, HIV prevalence, maternal mortality ratio, road mortality per
  # vehicle. floor = p1 of the strictly positive sample (handles p1 = 0).
  - indicator: infant_mortality
    direction: lower
    transform: log
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: infant_mortality

  - indicator: suicide_rate
    direction: lower
    transform: linear
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: suicide_rate

  - indicator: homicide_rate
    direction: lower
    transform: log
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: homicide_rate

  - indicator: cirrhosis_alcohol_mortality
    direction: lower
    transform: linear
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: cirrhosis_alcohol_mortality

  - indicator: obesity_rate
    direction: lower
    transform: linear
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: obesity_rate

  - indicator: hiv_prevalence_rate
    direction: lower
    transform: log
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: hiv_prevalence_rate

  - indicator: unemployment_rate
    direction: lower
    transform: linear
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: unemployment_rate

  # OFFICIAL ONLY (decision 6): no world-wide per-vehicle source exists —
  # 38 IRTAD areas on the OECD/ITF door (probed live v27: the door's other
  # unit carries 55 areas, the per-vehicle unit's club is the constraint).
  # corpus_metric maps to the companion road-mortality metric (the
  # per-vehicle face is todd_core: false) for the todd preset's book count.
  - indicator: road_accident_mortality_per_vehicle
    direction: lower
    transform: log
    sex_mode: both
    scores: [official]
    basis: consensus
    provisional: false
    corpus_metric: road_accident_mortality

  # OFFICIAL ONLY TOO (decision 15, v28): illegitimate_births joins the
  # score — Todd's illégitimité, the family-anthropology axis (todd_core:
  # true, 16 citations in 6 books). Direction LOWER: a high share of
  # births outside marriage is "bad" in Todd's reading, verified in the
  # books by Ediz. Official-only for a DATA reason (the auditor's
  # recommendation, Ediz can reverse it): the indicator exists for 47
  # entities, almost all European — in the modelled score it would push
  # about 40 non-European countries per year under the 0.60 coverage
  # threshold (modelled countries scored in 2015: 141 -> 104 in a test),
  # while in the official score it changes nothing (37 -> 37). Same
  # treatment as the per-vehicle road indicator (decision 6); the schema
  # refuses the id in the modelled score loudly (decision 15).
  - indicator: illegitimate_births
    direction: lower
    transform: linear
    sex_mode: both
    scores: [official]
    basis: todd
    provisional: false
    corpus_metric: illegitimate_births

  - indicator: maternal_mortality_ratio
    direction: lower
    transform: log
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: null

  # THE EDITORIAL INEQUALITY FACE: top income share stays, the Gini goes
  # (decision 7 — the same survey universe; two live facts: the WID Gini
  # witness covers exactly top_income's 3,203 country-year keys with 0
  # equal values, and the OECD canonical Gini shares 774 of its 906 pairs
  # with top_income, 85.4%). Decision 14 (v28): lower is better,
  # confirmed in the books — basis todd.
  - indicator: top_income_share
    direction: lower
    transform: linear
    sex_mode: both
    scores: [official, modelled]
    basis: todd
    provisional: false
    corpus_metric: top_income_share

  # (incarceration_rate was here until v27.1 — decision 11 removed it from
  # the score ONLY: no defensible monotone direction, the same movement
  # reads in opposite ways; it stays an indicator, todd_core true.)

  # THE SPLIT-SEX PAIR (decision 5): life expectancy and life expectancy at
  # 60 are published by sex only on the canonical tier — male and female
  # are two components of equal weight (0.5 each), and NO both-sexes
  # canonical series is ever derived in the indicator layer.
  - indicator: life_expectancy
    direction: higher
    transform: linear
    sex_mode: split
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: life_expectancy

  - indicator: life_expectancy_60
    direction: higher
    transform: linear
    sex_mode: split
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: null

  - indicator: math_test_scores
    direction: higher
    transform: linear
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: math_test_scores

  - indicator: secondary_education_share
    direction: higher
    transform: linear
    sex_mode: both
    scores: [official, modelled]
    basis: consensus
    provisional: false
    corpus_metric: secondary_education_share

  # CONFIRMED IN THE BOOKS (decision 12, v28): tertiary attainment and
  # industrial employment are higher-is-better, basis todd, no longer
  # provisional. Until v28 both carried basis: editorial + provisional:
  # true (the frontend caveat is retired with the confirmation).
  - indicator: tertiary_education_share
    direction: higher
    transform: linear
    sex_mode: both
    scores: [official, modelled]
    basis: todd
    provisional: false
    corpus_metric: tertiary_education_share

  # THE DECISION-10 FLIP (v27's only indicator-layer change): industrial
  # employment's direction is HIGHER is better (Todd defends industry
  # against free trade — L'illusion économique; config flipped
  # higher_is_better: false -> true in that same version, Breaking line in
  # the changelog). Decision 12 (v28): confirmed in the books — basis
  # todd, provisional flag retired.
  - indicator: industrial_employment_share
    direction: higher
    transform: linear
    sex_mode: both
    scores: [official, modelled]
    basis: todd
    provisional: false
    corpus_metric: industrial_employment_share
