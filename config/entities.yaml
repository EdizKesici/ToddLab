# config/entities.yaml -- geographic entity resolution table
#
# 249 current countries/territories generated from pycountry (ISO 3166-1,
# English names), plus 9 historical/manual entities added by hand (USSR,
# Czechoslovakia, Yugoslavia, East/West Germany, North/South Yemen,
# Kosovo).
#
# KNOWN LIMITATIONS (to fix before production use):
# - `source_ids.owid` is a BET: it assumes the OWID name == the pycountry
#   English label. True most of the time but NOT guaranteed (accents,
#   "Democratic Republic of Congo" vs "Congo, Dem. Rep."...). The OWID
#   connector logs an explicit warning (never crashes) when a name found
#   in a CSV has no match here -- see {indicator}.unresolved.json, which
#   is how this table gets corrected incrementally instead of guessed
#   upfront. Confirmed live (see CHANGELOG): aggregates/regions/income
#   groups (~27 names: 'World', 'Africa', 'European Union (27)'...) show
#   up as unresolved by design -- this project only models countries.
# - OWID Code values are NOT simply blank for non-ISO entities: OWID uses
#   "OWID_"-prefixed pseudo-codes (OWID_USS, OWID_KOS, OWID_WRL...). See
#   src/connectors/owid.py and normalize.py's classify_unresolved().
# - The 15 former Soviet republics carry a `formerly_part_of` field: OWID's
#   mortality data attaches pre-1991 values to each modern country's own
#   code rather than to a separate USSR entity, so their series run
#   continuously through 1991 with a flagged warning rather than being cut
#   at the entity's own founding year. See the `ussr` entity's notes and
#   docs/methodology.md for the full reasoning (resolved in conversation).
# - `source_ids.un_dyb` (added v6, ADR-0008 wiring): the entity's name AS
#   PRINTED in UN Demographic Yearbook tables when it differs from `label`
#   (e.g. label "United States" vs DYB "United States of America"). The 12
#   entries were verified against the live DYB 2024 Table 15 file
#   (scripts/check_dyb_name_resolution.py: 144/145 names resolve).
#   "Saint Helena ex. dep." is deliberately unresolved — the DYB territory
#   is narrower than the ISO entity (sub-territory granularity is an open
#   mapping question, visible in infant_mortality.unresolved.json).
# - Sub-national entities OWID tracks separately (England and Wales,
#   Scotland, Northern Ireland) are NOT modeled here yet. Flagged during a
#   live audit as potentially relevant to Todd's family-systems anthropology
#   (which operates partly at sub-national/regional level) -- deliberately
#   deferred, not decided against.

- entity_id: ussr
  label: Soviet Union
  iso3: null
  valid_from: 1922
  valid_to: 1991
  predecessor: null
  successors:
  - russian_federation
  - ukraine
  - belarus
  - moldova_republic_of
  - georgia
  - armenia
  - azerbaijan
  - kazakhstan
  - uzbekistan
  - turkmenistan
  - tajikistan
  - kyrgyzstan
  - lithuania
  - latvia
  - estonia
  source_ids:
    owid: USSR
    worldbank: null
    who_gho: null
    # Vintage name printed by the DYB collector's own tables (verified in
    # the 1978 edition text, the PDF-era rows the XLS loop cannot reach —
    # this override is PREPARATION for the PDF route, P1b: the as-reported
    # XLS loop 2007-2024 contains no USSR row by construction).
    un_dyb: Union of Soviet Socialist Republics
  label_source: manual
  notes: 'This project''s original tracer (Soviet infant mortality, see brief). RESOLVED
    (see conversation and CHANGELOG): a live-network audit found OWID carries no standalone
    ''USSR'' entity in the mortality datasets used here (infant-mortality, child-mortality),
    even OWID''s deepest long-run series (1751-2024) -- Gapminder/UN IGME attach historical
    values straight to each modern successor country''s own code instead. Decision:
    each of the 15 successor republics below shows one continuous series (pre- and
    post-1991) with a `formerly_part_of` warning on the pre-1991 portion, rather than
    a separate fabricated ''ussr'' series. This entity is kept for reference/documentation
    and in case a future source (e.g. HMD) does carry a genuine standalone USSR series.'
