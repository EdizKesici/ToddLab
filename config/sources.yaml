# Generic metadata per provider. Per-indicator config (which slug/code,
# which priority) lives in config/indicators/*.yaml — this file only holds
# what's true for every request to a given source.

owid:
  base_url: "https://ourworldindata.org/grapher"
  auth_required: false
  license_default: "CC-BY-4.0"
  layer: harmonized
  notes: >
    Layer: carries L3 model estimates for the pilot charts (UN IGME for
    infant mortality) — an honest, documented L4 redistribution of them.
    The executable layer map lives in src/schema/indicator.py
    (PROVIDER_LAYER); this block is the human-readable narrative.

    No API key. Rate limit not publicly documented: the connector uses an
    identifiable User-Agent out of courtesy, no aggressive parallelization
    while the number of indicators stays small (phase 1-2). Some grapher
    slugs return HTTP 403 on direct CSV download (observed on a modeled
    IHME/GBD chart during a live-network audit) even though the underlying
    dataset is otherwise public on the OWID site — treat a 403 as "this
    slug isn't fetchable this way", not as a transient error, and look for
    an alternative slug/source rather than retrying.

    v19 WID CHART DOORS (the corpus's own named inequality source,
    verified live 2026-09-21): incomes-of-the-richest (the top-1%
    pre-tax share, 165 entities, 1820-2024, single column, attribution
    "WID.world (2026) - World Inequality Database" read from the
    chart's own metadata) — CANONICAL for top_income_share, the
    oecd_family door-relation: api.wid.world refuses this environment
    on EVERY extractor shape (GET query-string, POST form, POST raw,
    browser headers — the endpoint the R/Stata packages ride, all
    CloudFront 403), the new portal's country pages are WordPress
    views carrying no data files, the old bulk-download path is gone
    (404): the chart IS the machine face of the compilation, root wid.
    The sibling income-share-top-1-before-tax-wid-extrapolations (227
    entities) is the SAME root plus the provider's own "(Projected)"
    column — refused by the anti-derivation line, never wired. The
    gini-coefficient-wid chart (165 entities, 1820-2024) is the gini
    WITNESS (root wid again, the pre-tax concept facing the IDD's
    disposable-income canonical — the seam displayed never
    reconciled). The Atkinson-Piketty historical chart (declining-
    share-of-the-top-1..., 8 entities 1871-2019) is also WID-rooted
    now (the series were folded in — its attribution says so): a
    self-witness, not wired.

    v16 witness door: share-of-births-outside-marriage (42 entities,
    1960-2021, verified live 2026-09-20) — OWID's own page attribution
    names the OECD Family Database ("OECD (2025)"): the chart is the
    L4 redistribution of the OECD-COMPILED SF2.4 share, root oecd_family,
    the illegitimate_births witness. The Family Database itself carries
    no SDMX wire (the v14 registry finding), so this chart door is the
    machine-readable face of that compilation — and on the co-covered
    EU entities it anchors on the national series (France 2020: 62.2 on
    both doors, Germany 1960 = DE_TOT's 7.6), which makes the vintage
    end (2021) its honest limit, not a modeling divergence.

worldbank:
  base_url: "https://api.worldbank.org/v2"
  auth_required: false
  license_default: "CC-BY-4.0"
  layer: harmonized
  notes: >
    Layer: HARMONIZED (L3) — the World Development Indicators do not
    collect: they REDISTRIBUTE the modeling families' series (UN IGME
    for the child-mortality codes, UN WPP for the life-expectancy
    codes); witness material, never canonical (ADR-0007/0008). This is
    the provider the `root` genealogy field was built for (v11): on
    infant mortality, OWID, WDI and GHO are three doors carrying ONE
    root — the catalog now says so from the data.

    Connector live since v11 (the phase-5 piece). API v2, JSON, no key:
    pagination is NOT optional (the documented default per_page is 50 —
    the connector requests per_page=5000, verified accepted live, which
    answers the wired codes' ~17.5k rows in 4 pages). /country/all
    includes the 78 aggregate entities (World, regions, income groups):
    the data rows carry no region field, so the connector fetches the
    provider's own /country classification once (region.id "NA" =
    Aggregates) and the parser drops the aggregates it lists, logged —
    the same "provider's own classification, not ours" judgment as GHO's
    SpatialDimType. Sex lives in the CODE suffix (.MA.IN / .FE.IN / the
    bare code), cross-checked at parse against the indicator NAME every
    row prints ("..., male (per 1,000 live births)") — a mismatch raises,
    never a guessed slice. Null values (the WDI year slot with no
    estimate yet — the trailing 2025 rows) stay explicit gap points.
    PRECISION, verified live: WDI prints its redistribution ROUNDED to
    v19 witness door: RS_198 ("Estimated road traffic death rate (per
    100 000 population)", the Global status report on road safety —
    197 countries at the report's own single 2021 vintage, RUS 2021 =
    10.6 included where the ITF collector never carried Russia). The
    road-safety RS_* family is a DIFFERENT WHO estimate family from
    the GHE (who_ghe): the biennial report's own modeled cross-section,
    its own root (who_roadsafety). The neighboring RS_196 (counts,
    195 rows) same single vintage — NO multi-year series exists on
    the API for this family, the record; the other RS_*/SDGROADAGE/
    SA_00000014xx road codes are age-standardized GHE material or
    policy indicators, probed and passed over.

    at most one decimal (France 2020 female IMR 3 where OWID/GHO carry
    3.33) — same root, coarser print, displayed by the divergence view.
    The v12 maternal codes (SH.STA.MMRT, SH.MMR.DTHS) are BARE codes —
    no sex dimension in the series — and print their estimates rounded
    to INTEGERS (South Sudan 1987 ratio 8045, India 1985 deaths
    180,000, verified live 2026-09-13); their WDI grid is the full
    1960-2025 window with the series valued 1985-2023, so the
    outside-window slots ride as explicit null gap points (the same null
    discipline, more of them — the provider's own print, kept as such).
    The v14 fertility code (SP.DYN.TFRT.IN) is also BARE (a synthetic
    measure over women's lifetimes has no sex split to print) and
    carries the WDI print precision AS CARRIED, which is per-observation
    (FRA 2022 = 1.78, RUS 1990 = 1.892 — verified live 2026-09-19):
    print precision is per-code, not provider-wide; each indicator
    config documents its own code's print.

who_gho:
  base_url: "https://ghoapi.azureedge.net/api"
  auth_required: false
  license_default: "CC-BY-3.0-IGO"
  notes: >
    Layer: HARMONIZED (L3) — the WHO Global Health Observatory's modeled
    estimates (its indicator names say so openly: "Estimates of...");
    witness material, never canonical (ADR-0007/0008). Connector live
    since v10, built for WHOSIS_000015 ("Life expectancy at age 60",
    the life_expectancy_60 witness — the piece of phase 5 pulled
    forward; OWID publishes no age-60 chart, its by-age charts jump
    45 -> 65). Since v11 it carries MDG_0000000001 (the IGME door on
    infant mortality), and since v13 SDGSUICIDE ("Crude suicide rates
    per 100 000", the GHE door on suicide_rate — the first who_ghe-root
    witness): that indicator disaggregates by AGE on Dim2, and the
    connector's Dim2 rule keeps the ALL-AGES series (AGEGROUP_YEARSALL)
    while dropping the latest-year age slices (6,105 records live,
    logged; an age slice would be a different indicator). All-ages
    records carry Low/High uncertainty intervals which remain dropped at
    parse per the documented witness-CI decision. More GHO indicators =
    phase 5, with the dims handling growing then.

    SpatialDimType=COUNTRY rows only (the provider's own classification
    filters REGION/GLOBAL/income groups — 726 rows in WHOSIS_000015 —
    which are dropped at parse and stored nowhere, the fetch log line
    being the record of the drop), the SEX dimension mapped to the
    project's male/female vocabulary.

un_dyb:
  base_url: "https://unstats.un.org/unsd/demographic-social/products/dyb"
  auth_required: false
  license_default: "UN data reuse policy (attribution required, no endorsement implied)"
  layer: collector
  notes: >
    Layer: COLLECTOR (L1-collector) — national official statistics
    republished as reported; the canonical tier of the Todd board together
    with `curated` (ADR-0008). Native per-1,000 rates = infant_mortality's
    canonical unit (no conversion on this path); Table 4 life expectancy
    comes in years (same as the indicator's unit) and MALE/FEMALE split
    (the collector prints no "both sexes" column — the sex field is part
    of the merge key, averaging would be a derivation).

    United Nations Demographic Yearbook: the COLLECTOR tier of the layer
    model (docs/the-measurement-problem.md section 7) — national official
    statistics republished as reported, with the UN's own quality codes
    ("C"/"U"/"|"/"..."), per-row footnotes, and honest gaps ("...",
    never interpolated). Rates only computed for "C"/"|" completeness per
    the table's own notes — that rule, not a bug, is why ~90 of ~148
    reporting countries have IMR rates per edition. Known coverage holes
    (Russia, US, China, UK absent from recent Table 15s) are reporting
    gaps to expose in the coverage report, not to patch.

    TABLE 9 (v15, wired 2026-09-20): "Live births and crude birth rates,
    by urban/rural residence" — the collector's natalité print, the SAME
    wide layout as Table 15 (Total/Urban/Rural rows, quality-code column,
    Number then Rate blocks, 5-year windows, Footnotes worksheet), so
    the Table 15 parser serves it through a dispatch branch with its own
    content guard (the title's words, the 21/22 lesson applied — table
    number verified STABLE across all 13 wired editions, but the title
    stays the ground truth). The wired block is the RATE (CBR per 1,000
    population, as computed by the UNSD from the countries' registered
    births — the SAME births Table 17's maternal ratios are computed
    from, the collector's own cross-table dependency). One Table-9-
    specific marker grammar find rides the connector: "*" glued to a
    footnote ref ("*47") on live-birth COUNT cells — provisional AND a
    note in one cell, 26 live occurrences across editions 2011/2017-
    2022, accepted as provisional + refs since v15. The unwired face:
    the Number block (live-birth counts — one `field: number` config
    away, the Table 15 rate/number precedent), and Table 10 (births by
    age of mother + general/age-specific fertility rates, latest-
    available-year cross-sections like Table 21 — verified on the 2024
    file to carry NO TFR column; summing the printed ASFR would be a
    derivation the canonical tier refuses).

    TABLE 21/22 (v10, wired 2026-09-13): "Life expectancy at specified
    ages for each sex: latest available year" — the by-age life tables,
    sex split in ROWS, ages 0, 5, ..., 100 across 21 columns. The table
    NUMBER ALTERNATES with the 5qx probabilities by edition parity
    (LE-by-age = table 21 in even editions, 22 in odd ones — verified
    across all 13 wired editions), so the connector's dispatch keys on
    the title TEXT, not the number, and raises with the parity rule on a
    wrong source_ref. Each edition is a LATEST-AVAILABLE-YEAR
    cross-section (one life table per country), so the reconstructed
    series is a stack of cross-sections, not an annual panel — a country
    that stops responding freezes (Russia's last table: 2012). Reference
    periods print in full ("2012 - 2015"); the year is the END of the
    period, the DYB's own convention (verified against Table 4's
    Roman-numeral rows, edition by edition).

    TABLE 17 (P3b, wired 2026-09-12; v12 = 13 editions + the counts
    indicator): maternal deaths (WHO-collected cause-of-death
    statistics) + maternal mortality ratios per 100,000 live births,
    computed and published by the UN Statistics Division — one "Number"
    row and, where the collector judges the data reliable enough, one
    "Rate" row per country. Table number STABLE across editions
    2011-2024 (the 21/22 renumbering zone does not reach this table).
    Since v12 the loop runs 13 editions (2011-2015 + 2017-2024: the
    2015 edition wired through the recovered legacy URL pattern) and
    BOTH blocks are wired — the ratio indicator reads the Rate rows,
    maternal_deaths reads the Number rows (the counts block is WIDER:
    the collector refuses ratios, never counts — 47 of the 124
    count-printing countries in the 2015 edition have no Rate rows at
    all, verified live 2026-09-13). Two table-specific as-reported
    annotations: the diamond marker (ratio based on 30 or fewer
    maternal deaths — small_base; a RATE-row annotation only, zero
    occurrences on Number rows verified on the 2015 file) and
    footnotes that often restate the quality code (notes 1-4 are
    literally "The code is C/+C/U/+U") or carry country caveats
    (Russia 2001-2003: Chechnya excluded). Pre-1975 rates used the
    female population as denominator — not comparable, and outside
    the wired 2001-2022 window anyway.

    EDITION LOOP (P1, everything below verified live, 2026-09-06; 2015
    re-verified 2026-09-13): 13 editions wired, per-table files, three
    eras — 2011-2014 on the legacy site
    (/unsd/demographic/products/dyb/dyb{ed}/Table{NN}.xls) as
    SpreadsheetML; 2016/2017/2021-2023 on the modern site as BINARY BIFF
    (xlrd, years-as-floats and footnote-suffixed country names
    normalized); 2018-2020/2024 as SpreadsheetML. Edition 2015
    RECOVERED in v10: its own per-table links are dead (tiny HTML error
    pages, PDF-only index) but the LEGACY pattern /dyb2015/TableNN.xls is
    alive and parses clean — verified by direct download (Table04 2.2
    MB, Table15 716 KB, Table21 468 KB, Table22 1.3 MB). Edition 2016:
    files FILEPASS-encrypted with an unknown password (msoffcrypto-tool
    verified: not empty) — not wired, zero coverage loss (2012-2016
    covered by editions 2014 + 2015 + 2017). Consecutive windows overlap
    and merge.py arbitrates by priority (later edition = later vintage
    wins, the standard vintage discipline; every arbitration logged in
    provenance.json). Coverage of the loop: 2007-2024, as-reported.


oecd:
  base_url: "https://sdmx.oecd.org/public/rest/data"
  auth_required: false
  license_default: "OECD Terms and Conditions, attribution required (content: WHO Mortality Database)"
  layer: collector
  # v22: the FOURTH dataflow — DSD_MIG_F@DF_MIG_POPF, "International
  # migration database - stocks of foreign-born population" (agency
  # OECD.ELS.IMD, read live from the SDMX registry): the migration
  # questionnaire's own BILATERAL matrix, REF_AREA x BIRTH_COUNTRY
  # (38 destinations x 242 origin codes, both axes OECD-ISO3), the
  # OECD-COMPILED foreign-born face of the International Migration
  # Database. THE ACCESS QUIRK (probed live 2026-09-22): positional
  # keys 404 on this flow (the observation dimension carries TIME
  # under the repo's dimensionAtObservation=AllDimensions convention),
  # so the door serves ONLY through the empty-key /all download — the
  # FULL dataset in one 18.2 MB CSV, already the pinned frame
  # (MEASURE=B14/FREQ=A/BIRTH_PLACE=_Z/EDUCATION_LEV=_Z/UNIT=PS: the
  # flow's whole vocabulary, hard-verified per row). SEX: _T + F both
  # ride the download — the wiring pins _T, the F rows drop logged
  # (the by-sex face recorded unwired). The origin vocabulary's own
  # quirks, decoded live from the DSD codelist: XKV (the OECD's
  # Kosovo), the _F vanished-entity prints (ANT_F "Former Netherlands
  # Antilles", CSK_F, SCG_F, SUN_F, YUG_F — mapped onto the withdrawn
  # ISO3 codes the entities declare, the v21 admission's by-origin
  # face), and the residual drops (W "the World-total row", W_X "World
  # unspecified", EEA, EU15, A4 "Caribbean", STLS "Stateless").
  # THE SIBLING FLOW, recorded unwired: DSD_MIG@DF_MIG ("International
  # migration database") carries CITIZENSHIP at position 2 — the
  # legal face, the mirror of Eurostat's migr_pop1ctz.
  notes: >
    Layer: COLLECTOR (P3 judgment) — the "Causes of mortality" dataflow
    (DSD_HEALTH_STAT@DF_COM, agency OECD.ELS.HD) redistributes the WHO
    Mortality Database: national civil-registration cause-of-death
    tables AS SUBMITTED by member states (ICD-coded; Assault =
    CICDHOCD, intentional self-harm = CICDHARM), no modeling, no
    imputation. Same judgment as un_dyb for content; the contrast with
    who_gho (whose homicide indicators are literally named "Estimates
    of ...") marks the collector/harmonized line. SDMX REST, no key,
    CSV responses; the connector pins all 13 dimension positions except
    REF_AREA and SEX, so one request returns the whole series (rate per
    100k = DT_10P5HB, counts = DT), and pins CALC_METHODOLOGY=CRUDE —
    the dataflow also carries age-standardized rates (STANDARD) for the
    same keys, a derived comparability measure the canonical tier
    deliberately excludes. Since v13 two causes are wired: CICDHOCD
    (homicide) and CICDHARM (suicide — the corpus's #2, verified live
    before any config: the cause list carries 50 codes, the suicide
    slice = 46 countries x 1960-2024, 7,225 rows, zero nulls, as-
    reported max LTU 1994 M 83.5).

    Why this route exists at all (investigated live 2026-09-11): the
    WHO Mortality Database itself has no documented public API — the
    platform.who.int/mortality portal is a JS app with obfuscated
    endpoints, the classic who.int/healthinfo bulk paths are dead, the
    dthub gateway is DNS-dead. The OECD SDMX API is the one clean
    programmatic route to the content found. Scope honestly partial:
    49 countries on homicide, 46 on suicide (OECD + key partners incl.
    RUS, CHN, BRA, ZAF, IND); Russia's series ends 2019 (the WHO MDB's
    own lag).

    v19 — THE THREE-FLOW CONNECTOR (the eurostat precedent applied to
    the OECD's own registry): beside DF_COM the connector now speaks
    DSD_WISE_IDD@DF_IDD (OECD.WISE.INE, the Income Distribution
    Database — the national household-survey microdata AS SUBMITTED,
    equivalized disposable income; the gini canonical, MEASURE=
    INC_DISP_GINI on unit 0_TO_1, 45 areas 1974-2025, RUS carried
    2008-2017 the RLMS survey window; the flow prints the same
    country-year under METHODOLOGY x DEFINITION vintages — METH2012
    the current computation, METH2011 the pre-revision history, D_CUR
    the current income definition, D_PREV/D_INC its back-series with
    and without the overlap year, labels read live from the DSD's own
    CL_DEFINITION codelist — so the gini config wires FOUR doors in a
    priority chain, the OECD explorer's own chained display made
    explicit, France sewing 1996-2011/2011-2020/2020-2023) and
    OECD.ITF DSD_INDICATORS@DF_SAFETY (the IRTAD road-safety
    statistics — police-reported crash registrations as submitted,
    55 areas 1994-2025, FATALITIES/10P5HB the per-100k face wired;
    the same flow printing the per-10k-registered-motor-vehicles face
    10P4VEH_MOT_ROAD — the exact denominator of Todd's own 1974 WHO
    table — and the per-billion-vehicle-km face 10P9VEHKM, both
    registered non-wired; RUS absent from the ENTIRE flow, zero rows
    on the full live slice, the honest coverage limit). Both new
    flows carry NO sex dimension (every row both-sexes). THE ENDPOINT
    GRAMMAR LESSONS (probed live 2026-09-21): the /public/rest/data
    endpoint REFUSES "latest" as the version token ("Invalid version
    string provided" — every flow reference carries its explicit
    registry version), and the SDMX-CSV envelope is uniform
    (DATAFLOW,<flow-urn>,I,<area>,... — REF_AREA behind the three
    envelope columns, the shared walker's existing skip rule handling
    the residue).

curated:
  base_url: "catalog/curated"   # in-repo directory, NOT a network endpoint
  auth_required: false
  license_default: "Facts with citation (small extracts, clearly attributed) — see docs/licenses.md"
  layer: curated
  notes: >
    Layer: CURATED (L0-L2) — hand-entered official/scholarly series with
    one citation per point, committed as CSVs in catalog/curated/*.csv and
    reviewed like code in pull requests. The curation gate (ADR-0007
    condition 3) keeps the tier finite, citable and PR-reviewable: a
    todd_ref must demand the point, the distortion vs the collector or
    harmonized layer must be demonstrated, and a citable source must
    exist — the connector mechanically rejects rows without a citation.
    "Fetching" a curated source is reading the committed CSV (no
    network); it then flows through the same raw-snapshot path as every
    other source. Series-level provenance and cross-checks:
    catalog/curated/README.md.

    Since v15 the tier carries its SECOND family of series: the MARKERS
    (dated institutional events, the corpus's own 'markers' family).
    The founding precedent was one series (ussr_infant_mortality_
    official, a collector-shaped series entered because the machine-
    readable collectors stopped at 2007); the markers are a different
    shape — ONE POINT per country, the point's year and value BOTH the
    event year, the citation the statute or the scholarly dating — and
    a different gate finding: for the markers the demonstrated
    distortion of condition (b) is the ABSENCE of any machine-readable
    door (probed live 2026-09-20: OWID 404 on every candidate slug for
    both marker metrics, the collectors print vital statistics, not
    statutes — the probe record lives in the v15 worklog). Current
    marker series: same_sex_marriage_legalization (33 countries,
    2001-2025) and universal_suffrage_introduction (16 countries,
    1848-1946, the historiography's own dating with the male/female
    decomposition per row).

eurostat:
  base_url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
  auth_required: false
  license_default: "Eurostat reuse policy (attribution required, no endorsement implied)"
  layer: collector
  notes: >
    Layer: COLLECTOR (v14 judgment) — Eurostat's questionnaire
    collections republish the series the national statistical offices
    themselves compute and publish: the DEMOGRAPHY questionnaire
    (dataset demo_find) carries the TFR (indic_de TOTFERRT, "births per
    woman", v14) and, since v16, the SHARE OF LIVE BIRTHS OUTSIDE
    MARRIAGE (indic_de NMARPCT, "Proportion of live births outside
    marriage" — the corpus's illegitimate_births, printed DIRECTLY by
    the collector, no ratio derivation); since v17 the LABOUR-FORCE
    questionnaire (dataset une_rt_a) carries the corpus's
    unemployment_rate — the national official rates (each office's own
    LFS print, 1-decimal as published, pinned age=Y15-74/unit=PC_ACT/
    sex=T: the age codelist carries no TOTAL — Y15-74 is the LFS's own
    labour-force window; the b/d flags ride as-reported, d on FR and ES
    2021-2025 = the LFS questionnaire redesign, a definitional seam
    surfaced not stitched). Collected by Eurostat via its own
    questionnaires: no modeling, no cross-country harmonization of
    definitions. The same collector judgment as un_dyb for content; the
    contrast with who_gho/worldbank (WPP/ILOEST redistributions) marks
    the collector/harmonized line. Live since v14 for ONE dataset, v17
    for TWO, v18 for FIVE: the connector dispatches by dataset
    (demo_find's ref grammar '{code}[/{geo}]', une_rt_a's
    '{age}/{unit}/{sex}', nama_10_a10_e's '{na_item}/{unit}/{nace}',
    edat_lfse_03's '{isced11}/{age}/{sex}', migr_pop3ctb's
    '{c_birth}/{age}/{sex}', each with its own layout pin-guard —
    another dataset remains another dispatch decision, the
    one-block-at-a-time scope of the DYB tables) — now serving EIGHT
    Todd metrics through its five questionnaires. THE v18 ADDITIONS:
    the NATIONAL ACCOUNTS (nama_10_a10_e) print the industrial and
    agricultural employment SHARES directly at unit PC_TOT_PER (the
    finding that dissolved the composite-derived-layer question — the
    industrial record below); the LFS ATTAINMENT table (edat_lfse_03)
    prints the tertiary and secondary attainment shares (one
    questionnaire — the labour-force survey — now carrying THREE Todd
    metrics: unemployment, tertiary, secondary); the MIGRATION
    collection (migr_pop3ctb) prints the foreign-born stock per
    country (pinned c_birth=FOR). THE EA EDGE (v18, nama only): that
    dataset's geo codelist carries the Euro-area aggregate as the bare
    TWO-LETTER code "EA" (verified live 2026-09-21, the only
    two-letter aggregate in any wired Eurostat codelist) — dropped
    logged by the connector's per-dataset aggregate table.

    API (v1.0 dissemination, JSON, no key; verified live 2026-09-19):
    flat positions over the response's own dimension order [freq,
    indic_de, geo, time]; cells with no observation are ABSENT from
    `value` (no explicit gap rows, unlike the WB grid); an optional
    `status` object carries the collector's per-observation flags (b =
    break in series, e = estimated, p = provisional — combos occur),
    transported as-reported on quality_code/provisional. THE GEO
    CODELIST QUIRKS (pycountry answers none of them, verified live):
    EL = Greece (never ISO's GR), UK = the UK (never ISO's GB), FX =
    Metropolitan France (the series-variant code) — the connector maps
    all three to ISO3 explicitly; XK = Kosovo (v21): mapped to XKX,
    the user-assigned code the kosovo entity now carries as its iso3
    (the WB prints the same code as countryiso3code) — the v1-era
    pending decision RESOLVED, pre-2008 rows still refusing on the
    entity's valid_from. Longer geo codes are
    the codelist's aggregates (EU27_2020, EA20, EFTA...) plus DE_TOT
    ("Germany including former GDR") — a CODE-SPECIFIC case, both
    directions verified live: on TOTFERRT (2026-09-19) DE_TOT prints
    values IDENTICAL to DE on all 25 overlapping years (one German
    door, the duplicate dropped at parse, logged); on NMARPCT
    (2026-09-20) the relationship REVERSES — DE_TOT is the FULL 65-year
    series and DE's five pre-reunification benchmarks are FRG-only
    prints that DIVERGE (1960: 6.3 vs 7.6; 1970: 5.5 vs 7.2; 1980:
    7.6 vs 11.9; 1985: 9.4 vs 16.2; 1990: 10.5 vs 15.3 — the GDR's
    high non-marital share), so DE_TOT rides its own geo-pinned
    source (demo_find/NMARPCT/DE_TOT, priority ABOVE the main slice)
    and the merge logs every DE collision as a provenance discard —
    the FX/FR seam's architecture applied to a definitional seam. THE
    FRANCE VARIANT PAIR: FX (metro, 1960-2012) and FR (whole France,
    1998-2024) are dropped from the all-countries slice and wired as
    their own geo-pinned source_refs (demo_find/{code}/FX, .../FR)
    with distinct priorities — the merge arbitrates the 1998-2012
    overlap by vintage with every discarded value logged, the DYB
    edition-loop discipline.

    WHY THIS PROVIDER EXISTS (the v14 finding, verified live before any
    config): the corpus's #1 metric is TFR and NO other collector wire
