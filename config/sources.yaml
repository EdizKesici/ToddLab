# 15/22 — the collector's as-reported prints of states the modern XLS
# loop (2007-2024) cannot carry by construction. The three curated CSVs
# (catalog/curated/dyb1978_vanished_*.csv) transcribe those prints;
# every value READ from the archived text layer and arithmetically
# cross-checked BEFORE entering the catalog (Table 15 count / Table 15
# rate reproduces Table 9 births within 0.4% on all fifteen CSK/GDR/YUG
# year-pairs; Table 4's latest-year CBR/IMR equal Table 9/15's; Table
# 4's LE equals Table 22's age-0 column). Root: unsd_dyb — the DATA's
# origin is the collector's own 1978 print, the curator transcribes.
# The format extension (sex/provisional/quality_code/reference_range
# columns) is the transcription family's own grammar, validated loudly.
#
# THE BYSSR/UkSSR DECISION (settled by the same tables): the USSR, the
# Byelorussian SSR and the Ukrainian SSR were THREE distinct UN member
# seats — the 1978 questionnaire prints each its own rows (Table 9:
# 4,546,095 / 146,876 / 736,616 live births in 1974; Table 15: 125,908
# / 2,443 / 14,136 infant deaths; Table 4: each its own LE pair). The
# as-reported principle carries them as three entities; the successors'
# continuous witness-attached series never collide (distinct ids, the
# merge key is (entity, year, sex)).
#
# THE YEMEN NEGATIVE FINDING: the two Yemen entities' 1978 prints
# (CBR 48.7 / 48.2 and LE 37.3/38.7, 40.6/42.4, period 1970-1975)
# carry footnote 4 — "Estimate(s) for 1970-1975 prepared by the
# Population Division of the United Nations." UN PD estimates are the
# WPP family: WITNESS-class by the project's constitution, never
# canonical. The rows are excluded from the transcription tables; the
# entities remain declared-but-data-less until a genuine as-reported
# door opens (a national statistical office print, a citable survey).
#
# THE CHANNEL ISLANDS DECISION: the WB's CHI rows (66 per witness
# indicator) stay the documented PERMANENT unresolved class — a
# WB-specific grouping of two crown dependencies (Jersey/Guernsey, each
# with its own ISO code GG/JE), no Todd corpus metric demanding them,
# no invented umbrella entity. The DYB 1978 prints Channel Islands rows
# of its own (infant deaths 1974-1977); they stay un-transcribed for
# the same reason.
#
# UNWIRED DOORS RECORDED (v21 additions): the earlier DYB editions
# (1975-1977 and before — each would extend the vanished-entity windows
# one print at a time, each needing its own text-layer verification
# pass); the DYB 1978 population tables (T2/T3/T5 — no population
# indicator in the project, the prints documented in the probe
# evidence); Table 22's non-zero age columns (the LE-at-25 prints —
