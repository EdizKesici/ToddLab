id: birth_rate_fertility
label: "Total fertility rate"
family: society
unit: births_per_woman
higher_is_better: false
todd_core: true

sources:
  # THE CORPUS'S #1 (todd_refs, 111 citations, 16/16 books — the only
  # metric Todd uses in every single book) and THE TFR-vs-CBR DECISION v14
  # answers: Todd's variable is FERTILITY PER WOMAN (the corpus notes say
  # it outright — "World TFR decline", "TFR trends 1965-77", "onset
  # dates", "threshold crossings"), not the crude birth rate. The two
  # measures differ in exactly one thing that matters for Todd's
  # year-by-year country comparison: the CBR (births per 1,000 total
  # population) is dragged by age structure — a young country prints high
  # CBR at moderate fertility, an old country prints low CBR at the same
  # TFR — while the TFR (the synthetic number of children per woman
  # passing through one year's age-specific rates) is structure-free by
  # construction, comparable across countries AND across Todd's full
  # 1870-2020 span. The CBR face (the collector's own natalité print,
  # DYB Table 9, a different unit) is recorded in sources.yaml as the
  # unwired companion door — a future crude_birth_rate decision.
  #
  # THE CANONICAL FINDING (verified live 2026-09-19, before any config):
  # the collector tier's TFR doors are Eurostat's demo_find and — v28.1's
  # live correction — the UN DYB's Table 4, which PRINTS the finished rate
  # ("Total fertility rate / L'indice synthétique de fécondité", column
  # 21, verified live in every wired edition 2011-2024). The 2026-09-19
  # probe had probed Table 10 (general and age-specific fertility rates,
  # latest-year cross-sections) and concluded "no TFR column" — true of
  # Table 10, blind to Table 4; the v28 Part B probe found the printed
  # column and the v28.1 review wired it (the ranked plan #1). Summing
  # Table 10's ASFR would remain the derivation the canonical tier
  # refuses by constitution; the printed Table 4 column needs none — the
  # same printed-value status as Table 17's maternal ratios. So the
  # collector tier is Eurostat (the TFR each national statistical office
  # computes, collected via the Eurostat questionnaire) + the DYB (the
  # TFR the UNSD computes from registered births by mother's age,
  # collected via the annual vital-statistics questionnaires).
  - provider: eurostat
    ref: demo_find/TOTFERRT
    priority: 1
    role: canonical
    root: eurostat_demo
  # THE FRANCE VARIANT PAIR (the FX/FR seam): Eurostat prints TWO French
  # series — FX "Metropolitan France" 1960-2012 (53 points; INSEE ended
  # the metro-only series) and FR "France" 1998-2024 (27 points, whole
  # France incl. overseas departments; the overlap prints slightly
  # different values: 2000 = 1.87 metro vs 1.89 total, both as-reported).
  # Neither is a duplicate of the other, so each rides its own
  # geo-pinned source_ref and the merge arbitrates the 1998-2012 overlap
  # by priority — FR (the later-maintained national series) wins, every
  # discarded FX value logged in provenance.json: the standard vintage
  # discipline, the DYB edition-loop precedent. The canonical French
  # series is therefore FX 1960-1997 + FR 1998-2024, seam included — the
  # metropolitan France of Todd's books carries the pre-1998 canon.
  - provider: eurostat
    ref: demo_find/TOTFERRT/FR
    priority: 2
    role: canonical
    root: eurostat_demo
  - provider: eurostat
    ref: demo_find/TOTFERRT/FX
    priority: 3
    role: canonical
    root: eurostat_demo
  # v28.1 — THE SECOND CANONICAL DOOR (the v28 ranked wiring plan #1,
  # approved in Ediz's review, 2026-10-07: "Le câblage de la fécondité
  # par l'Annuaire démographique (risque faible, gain de 4 à 5 pays), à
  # essayer avec le reste"): the DYB Table 4 TFR, the SAME file the
  # life_expectancy loop already fetches (edition loop 2011-2024, the
  # FILEPASS-encrypted 2016 deliberately absent — the inherited vintage
  # discipline), read through the connector's new `field: tfr` block.
  # PRIORITY-MERGED UNDER EUROSTAT (the FX/FR seam discipline): an
  # entity-year both collectors print keeps Eurostat's value, every
  # discarded DYB candidate logged in provenance.json — the overlap
  # agreement read live on 564 shared keys: 220 exact, 157 within 0.01,
  # 128 within 0.05 (rounding-level), and 7 entities with real
  # collector-vs-collector seams >= 0.1 (Azerbaijan 0.44 max — the DYB
  # prints ~2.3 where Eurostat prints ~1.9; Romania, Bulgaria, Georgia,
  # Latvia, Moldova, Montenegro) — displayed as the two collectors'
  # definitional seams, never reconciled, exactly the FX/FR precedent.
  # The DYB fills what Eurostat never asked: the non-European world
  # (Japan, Korea, the US, Israel, New Zealand, Latin America, Asia,
  # Africa's civil-registration countries — 222 resolved entities over
  # 2007-2024), the UK after Brexit (Eurostat ends 2018, the DYB carries
  # 2019-2023), and single hole-years inside Eurostat's own span
  # (Belarus 2009, Ukraine 2013, Moldova 2013/2016, Georgia
  # 2011/2013/2021).
  - provider: un_dyb
    ref: 2024/table04
    field: tfr
    priority: 4
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2023/table04
    field: tfr
    priority: 5
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2022/table04
    field: tfr
    priority: 6
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2021/table04
    field: tfr
    priority: 7
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2020/table04
    field: tfr
    priority: 8
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2019/table04
    field: tfr
    priority: 9
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2018/table04
    field: tfr
    priority: 10
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2017/table04
    field: tfr
    priority: 11
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2015/table04
    field: tfr
    priority: 12
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2014/table04
    field: tfr
    priority: 13
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2013/table04
    field: tfr
    priority: 14
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2012/table04
    field: tfr
    priority: 15
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2011/table04
    field: tfr
    priority: 16
    role: canonical
    root: unsd_dyb
  # THE WITNESS: WDI's TFR redistribution of UN WPP (bare code, no sex
  # dimension — a synthetic measure over women's reproductive lifetimes
  # has no split to print), ~200 countries, 1960-2024, the WDI print
  # precision as carried (FRA 2022 = 1.78, RUS 1990 = 1.892, both
  # verified live). Root un_wpp — the same root the life_expectancy
  # witnesses carry; for the EU countries WPP anchors on the national
  # series (FR 2022: collector 1.78, witness 1.78), and the divergence
  # case lives where WPP models what the collector never collected
  # (Russia post-2010, the whole non-European world).
  - provider: worldbank
    ref: SP.DYN.TFRT.IN
    priority: 17
    role: witness
    root: un_wpp

coverage_start: 1960
coverage_end: 2024

reliability: high
reliability_criteria: >
  Canonical tier = two collectors, priority-merged under Eurostat (v28.1):
  Eurostat demo_find TOTFERRT, the national official total fertility
  rates as collected by Eurostat (questionnaire collector), 47 country
  codes on the main slice (46 printing values, Bosnia none) plus the two
  French series — 46 valued entities, 1960-2024, per-observation status
  flags (b/e/p) transported as-reported; and UN DYB Table 4's PRINTED
  total fertility rate (field: tfr), editions 2011-2024 (2016
  FILEPASS-encrypted, deliberately absent), 222 resolved entities over
  2007-2024, sex=None by construction, per-point footnote refs and
  reference ranges transported as-reported, explicit "..." gaps kept as
  gap points. Overlap arbitration: Eurostat wins every shared entity-year
  (discarded DYB values logged in provenance.json); the 7 seam entities
  (Azerbaijan, Romania, Bulgaria, Georgia, Latvia, Moldova, Montenegro)
  are collector-vs-collector definitional seams, displayed never
  reconciled. Witness tier = UN WPP estimates via the World Bank's
  SP.DYN.TFRT.IN (modeled, ~200 countries, 1960-2024, the WDI print
  precision as carried: FRA 2022 = 1.78, RUS 1990 = 1.892). Authenticity
  first per ADR-0008: displayed beside each other, never blended.
reclassification_sensitive: false

plausible_range:
  min: 0
  max: 10   # the collector's own history stays below 4.1 (Ireland 1964
            # = 4.07 is the live slice's maximum, verified 2026-09-19); the
            # bound's headroom belongs to the WITNESS, whose WPP modeled
            # tail peaks at Yemen 1985 = 8.86 (verified live) — revision
            # headroom without swallowing unit errors: a per-1,000 misload
            # (a crude-birth-rate value) prints >= 10 immediately.

license: >
  Mixed, per source (see "sources"): Eurostat = Eurostat reuse policy
  (attribution required, no endorsement implied); World Bank witness =
  CC-BY-4.0.

# v16: the companion link, declared on BOTH sides (the symmetry the
# cross-validation enforces — a one-way declaration fails the build):
# crude_birth_rate reads the same demographic phenomenon through the
# OTHER measure (births per 1,000 total population, the collector's own
# natalité print — DYB Table 9). Two indicators, two measures, never a
# unit conversion: the CBR drags the age structure the TFR is free of.
companion_indicators: ["crude_birth_rate"]

notes: >
  THE EIGHTH INDICATOR, THE CORPUS'S #1 (111 citations, 16/16 books —
  fertility is the only metric Todd uses in every book: the
  19th-century European transition of L'invention de l'Europe and
  L'enfance du monde, the Soviet natality collapse of La Chute finale,
  the world TFR decline of Après l'Empire, the onset dates of Où en
  sommes-nous ?, the 2015 Catholic-periphery comparison of Qui est
  Charlie ?). The unit is CHILDREN PER WOMAN — the corpus notes'
  "TFR decline", "threshold crossings" and "onset dates" are all
  statements about this quantity; the replacement threshold (~2.1)
  against which Todd reads every series is native to it. higher_is_better
  is REQUIRED by the schema but carries no normative claim here: the
  corpus's dominant signal is the fertility TRANSITION (the decline),
  so false is the least-misleading default — the board reads levels and
  drops, not a direction. THE SEX DIMENSION IS ABSENT BY CONSTRUCTION:
  TFR is already a synthetic measure over women's lifetimes; no split
  exists to report, and every point carries sex=None.

  CANONICAL TIER: Eurostat first (three sources, one collector). The
  main slice (demo_find/TOTFERRT) serves 47 country codes, 46 of them
  printing values — Western Europe annually from 1960 (65 points each),
  the Eastern partnership partially (Russia 2006-2010, Belarus to 2018,
  Ukraine to 2019, Moldova to 2023 — the national offices stopped
  answering the questionnaire, the collector's honest freeze, exactly
  Russia's last DYB life table; Bosnia and Herzegovina prints NO point
  at all, the questionnaire never answered), the UK to 2018 (Brexit
  ended the series: pre-2019 British comparisons are canonical-only,
  post-2019 witness-only). The German series is 2000-2024 (DE wired;
  DE_TOT dropped at parse — verified live to print values identical to
  DE on every one of the 25 overlapping years). Kosovo (XK) prints
  2016-2019 but resolves to no ISO3: it flows to the unresolved report,
  the SAME pending product decision as the World Bank's Kosovo — a
  decision, not a bug. THE FX/FR SEAM: France rides TWO series (FX
  metropolitan 1960-2012, FR whole-France 1998-2024); the merge keeps
  FX 1960-1997 + FR 1998-2024 and arbitrates the 15 overlap years to FR
  (later vintage wins, each discarded FX value logged in
  provenance.json) — the definitional seam the collector itself printed
  (1998: 1.76 metro vs 1.78 total; 2000: 1.87 vs 1.89; 2010: 2.02 vs
  2.03), displayed, never reconciled. The collector's per-observation
  flags ride as-reported: quality_code carries the printed letter
  (b = break in series, e = estimated, p = provisional — FR 2014 carries
  'b', the French series' own methodological break), provisional=true
  where the flag contains p.

  THE DYB DOOR (v28.1, the second collector): Table 4's printed TFR,
  editions 2011-2024 priority-ordered (later edition = later vintage =
  higher priority, the edition-loop precedent; 2016 FILEPASS-encrypted,
  deliberately absent, verified live), every value sex=None (a synthetic
  measure over women's lifetimes has no split to report — the TOTFERRT
  discipline), per-point footnote refs (Japan's values carry their
  note; Korea's carry '102' on the 2024 edition) and reference ranges
  as-reported, explicit "..." gaps kept as gap points (the collector
  computes rates only for C/"|"-grade registration — the same honest
  degradation as Table 15). Where both collectors print, Eurostat wins
  (priority, provenance-logged): the 564-key overlap is 505/564 within
  0.05 (rounding-level agreement), with 7 entities carrying real
  collector-vs-collector seams (Azerbaijan the widest at 0.44 — the
  DYB's ~2.3 against Eurostat's ~1.9, both as-reported by their own
  questionnaire chains; then Romania, Bulgaria, Georgia, Latvia,
  Moldova, Montenegro) — two collectors' definitional seams, displayed,
  never reconciled. What the door ADDS: the whole non-European
  civil-registration world (222 resolved entities, 2007-2024 — Japan,
  Korea, the US, Israel, New Zealand, Latin America, Asia, Africa's
  registration countries), the UK's post-Brexit 2019-2023 (the canonical
  series resumed — pre-v28.1 the UK was witness-only there), and
  Eurostat's own single hole-years (Belarus 2009, Ukraine 2013, Moldova
  2013/2016, Georgia 2011/2013/2021). China prints NO TFR row at all in
  any wired edition (the collector's own hole — the witness carries
  China, as it always has).

  WITNESS TIER: one door, the minimal honest choice (the v13
  discipline): WDI's WPP redistribution, worldwide — the face the
  canonical tier's honest partiality cannot serve (Todd's Muslim-world
  and Central-Asia comparisons of Après l'Empire live HERE, on the
  modeled layer, next to a collector that never asked those countries).
  Where the tiers agree (EU, post-2000), they agree because WPP anchors
  on the national series — the root field says so (un_wpp beside
  eurostat_demo: two independent roots, the genealogy display's exact
  case); where they diverge (Russia after 2010 — collector frozen,
  witness modeled on), the divergence IS the story the board displays.

  HONEST SCOPE LIMITS: no 19th-century history on the canonical tier
  (Eurostat starts 1960 — Todd's 1870-1930 European transition onset
  dates are BOOK data, territory for the curated tier or the HFD
  decision); no USSR entity (dissolved before the wire); the witness
  inherits WPP's revisions silently (no vintage pinning on that door).
  UNWIRED DOORS, recorded for the next decisions: GHO 'tfr' (a third
  un_wpp door — the "illusion of independent verification" warning
  applies, one witness door suffices), OWID 'children-per-woman' (pure
  WPP 1950-2023, 254 entities — same root again) and
  'total-fertility-rate' (WPP + pre-1950 depth for a handful of
  countries, Sweden from 1891 — would need its own composite root),
  DYB Table 9 (the collector's CBR face, a different unit — the wired
  crude_birth_rate companion), DYB Table 10
  (general + age-specific fertility rates, latest-available-year
  cross-sections, no TFR column — verified on the 2024 file), and the
  Human Fertility Database (France from 1817, the collector with the
  historical depth Todd's onset dates need — the HMD-class pending
  decision recorded in sources.yaml).
