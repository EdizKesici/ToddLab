# womens_suffrage_introduction_year (v30, the extra metric set): outside
# Todd's books (todd_core: false), listed in extra_core.csv.
#
# THE SOURCE: the Inter-Parliamentary Union's "Women's Suffrage" table
# (archive.ipu.org/wmn-e/suffrage.htm), read 2026-10-14: 68 year-rows listing,
# per country, the year women obtained the right to vote and to stand for
# election, with the IPU's own flags for rights "subject to conditions or
# restrictions" and "restrictions or conditions lifted". The IPU compiles the
# dates from the national legislation. The page stops at 2005 (Kuwait) and
# prints no country that held no national election (Saudi Arabia, Oman, Qatar,
# the United Arab Emirates, the Vatican...): those countries are ABSENT, never
# guessed.
id: womens_suffrage_introduction_year
label: "Women's suffrage introduction year"
family: markers
unit: year
higher_is_better: false
todd_core: false

sources:
  - provider: curated
    ref: womens_suffrage_introduction
    priority: 1
    role: canonical
    root: national_legislation

coverage_start: 1893
coverage_end: 2005

reliability: medium
reliability_criteria: >
  Canonical tier = a curated table of 185 countries, one row each, every row
  citing the IPU "Women's Suffrage" table entry it was read from. The year is
  the IPU's date of the right to vote in national elections ON EQUAL TERMS
  (decision 24, 2026-10-14): when the IPU flags the first grant as restricted
  and records the restrictions lifted later, the lifted date is kept and the
  first grant rides the row's definition_note (United Kingdom 1928, Belgium
  1948, Portugal 1976, Australia 1962, Canada 1950). Medium, not high: a
  single compiler for all rows (no per-row cross-check against the statutes),
  an archive page last updated in 2005, and a convention choice (equal terms,
  not first grant). Staged grants by population group take the latest stage so
  that every woman is covered (South Africa 1994, Nigeria 1978); where the IPU
  lists several dates as stages of one grant (confirmation at independence),
  the earliest is kept. No witness tier: the Lexical Index of Electoral
  Democracy (via OWID, "Universal right to vote for women") dates the EFFECTIVE
  universal right and disagrees with the IPU's legal dates for most countries
  (2026-10-14 comparison: 68 of 179 matched countries identical, the others
  mostly one to two years apart, a few by decades - Brazil 1932 against 1985,
  South Africa 1930 against 1994, Chile 1949 against 1970), a different
  concept: recorded, not wired.

reclassification_sensitive: false

plausible_range:
  min: 1890  # the first national grant is New Zealand 1893; anything earlier
  max: 2030  # is a misload, and the marker IS its year.

license: >
  Facts with citation (small extracts, clearly attributed) - see
  docs/licenses.md and catalog/curated/README.md.

notes: >
  Year women obtained the right to vote in national elections, on equal
  terms, one row per country (the marker's shape: the point's year = the
  value). Europe's step, as the table prints it: Finland 1906, Norway 1913,
  Denmark 1915, Germany 1918, the Netherlands 1919, the United Kingdom 1928,
  France 1944, Italy 1945, Belgium 1948, Greece 1952, Switzerland 1971,
  Portugal 1976, Liechtenstein 1984. THE HONEST LIMITS: the equal-terms date
  is a convention (the first grant is in each row's note); the IPU page is
  an archive, so recent changes and countries without national elections are
  absent; Yemen merges two pre-unification dates (Arab Republic 1970, D.P.R.
  1967, the later kept); "Yugoslavia" is the historical entity (1946), Serbia
  and Montenegro have no row.
