id: crude_birth_rate
label: "Crude birth rate"
family: society
unit: births_per_1000_population
higher_is_better: false
todd_core: false

sources:
  # v21: the DYB 1978 vanished-entities transcription (the PDF route):
  # the USSR 1974-1977 CBR (18.0/18.1/18.4/18.1 — the union's OWN print,
  # joined to the official IMR series), the Byelorussian/Ukrainian SSR
  # 1974-1977 rows (the two other UN-member Soviet seats), and the
  # Czechoslovakia/GDR/Yugoslavia full 1974-1978 Total rows — every value
  # READ from the archived text layer, arithmetically consistent with the
  # same edition's Tables 4/15 (cross-checks in catalog/curated/README.md);
  # root unsd_dyb: the data's origin is the collector's own 1978 print.
  # The Yemen T4/T9 prints are EXCLUDED: footnote 4 marks them Population
  # Division ESTIMATES (1970-1975) — witness-class by the project's
  # constitution, never canonical (see config/sources.yaml, v21 record).
  - provider: curated
    ref: dyb1978_vanished_crude_birth_rate
    priority: 1
    role: canonical
    root: unsd_dyb
  # THE CBR COMPANION (v15): the v14 TFR-vs-CBR decision left this door
  # open on purpose — Todd's variable is fertility PER WOMAN (the corpus
  # notes say it: "World TFR decline", "onset dates", "threshold
  # crossings"), but his 19th-century citations read the CRUDE birth rate
  # too ("Crude birth rate milestones: France < 30/1 000, Europe 30-38/
  # 1 000 (19th c.)" — L'invention de l'Europe's own label), and the
  # collector prints it natively. Hence a SEPARATE indicator (never a
  # unit conversion of TFR — the two measures differ by exactly the age
  # structure CBR drags along), carrying its own metric identity under
  # the birth_rate_fertility corpus umbrella (companion_indicators below).
  #
  # CANONICAL = the collector's own natalité print: DYB Table 9, "Live
  # births and crude birth rates, by urban/rural residence" — the same
  # wide Total/Urban/Rural layout as Table 15, Total rows only, CBR per
  # 1,000 population as computed by the UN Statistics Division from the
  # countries' own registered births (the SAME births Table 17's maternal
  # ratios are computed from — the collector's own cross-table
  # dependency). 13 editions = the standard loop (2016 FILEPASS-encrypted,
  # never wired, zero coverage loss), later edition = later vintage =
  # higher priority, every overlap arbitration logged.
  - provider: un_dyb
    ref: 2024/table09
    field: rate
    priority: 2
    role: canonical
    root: unsd_dyb
