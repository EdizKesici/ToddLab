  # THE WITNESS: WDI's CBR redistribution of UN WPP (bare code, no sex
  # dimension — a population-level rate has no split to print), the
  # worldwide face the collector's questionnaire partiality cannot serve.
  # Root un_wpp, the same root the birth_rate_fertility witness carries:
  # for the EU both doors anchor on national series; for the rest of the
  # world the witness models what the collector never asked. WPP's CBR is
  # a STRUCTURE-CARRYING measure (it re-derives births from the modeled
  # population), so the divergence vs the collector's registered-births
  # CBR is exactly the age-structure-vs-registration story the divergence
  # view was built to display.
  - provider: worldbank
    ref: SP.DYN.CBRT.IN
    priority: 15
    role: witness
    root: un_wpp

coverage_start: 1974  # v21: the DYB 1978 curated vanished-entities tables (1974-1978) predate the XLS loop
coverage_end: 2024

reliability: high
reliability_criteria: >
  Canonical tier = UN DYB Table 9 crude birth rates across 13 editions
  (2011-2015 + 2017-2024, 2016 FILEPASS-encrypted and unwired), 2007-2024,
  computed by the UN Statistics Division from the countries' own
  registered births and republished as reported (rates only for
  completeness codes C/|, the collector's own editorial rule); witness
  tier = UN WPP estimates via the World Bank's SP.DYN.CBRT.IN (modeled,
  ~200 countries, 1960-2024). Authenticity first per ADR-0008: displayed
  beside each other, never blended.
reclassification_sensitive: false

plausible_range:
  min: 0
  max: 60   # the witness's own WPP history stays below 58 (Niger 1960 =
            # 57.613, verified live 2026-09-20 — the highest national CBR
            # the series prints); the bound's headroom belongs to the
            # collector's questionnaire tail (an isolated small-state
            # print above 55 would still fit) while a per-woman misload
            # (a TFR value ~1-9) reads as implausibly low against the
            # collector's own value and a per-birth count misload flags
            # immediately at >= 1000.

license: >
  Mixed, per source (see "sources"): UN DYB = UN data reuse policy
  (attribution required, no endorsement implied); World Bank witness =
  CC-BY-4.0.

companion_indicators: ["birth_rate_fertility"]

# v16 note: the companion link is declared on BOTH sides (the TFR's own
# config carries ["crude_birth_rate"] back) — the symmetry contract
# cross_validate_companions enforces at every config load; the v15
# one-way declaration (only this file pointed across) was the asymmetry
# the external review caught.

notes: >
  THE NINTH INDICATOR, THE CBR COMPANION (v15). The corpus's #1 metric
  (birth_rate_fertility, 111 citations, 16/16 books) is TFR — v14 settled
  that. But the corpus's own 19th-century rows read the CRUDE birth rate
  ("Crude birth rate milestones: France < 30/1 000, Europe 30-38/1 000
  (19th c.)", "Crude birth rate by community in colonial Algeria"), the
  measure the era's statistical offices actually printed — and the two
  are NOT convertible: CBR (births per 1,000 total population) drags the
  age structure along (a young country prints high CBR at moderate
  fertility, an old country prints low CBR at the same TFR), which is
  precisely why they ride as TWO indicators, never as a unit conversion.
  This one is todd_core=false on purpose: no corpus metric carries the
  crude rate as its own id — the 19th-century CBR rows live under
  birth_rate_fertility's umbrella, and the companion_indicators link
  carries the relationship (the board reads them side by side).

  CANONICAL TIER: the collector's own natalité print, DYB Table 9 — the
  same wide layout as Table 15 (Total/Urban/Rural rows, quality-code
  column, 5-year windows per edition, footnotes worksheet), 13 editions
  2007-2024 with the standard vintage arbitration. The collector's
  honest degradations ride as-reported: "U"-coded countries print birth
  counts with "..." rates (explicit gap points), the '*' provisional
  flag and glued '*NN' star-plus-ref markers travel on the points (the
  v15 grammar find: a provisional birth count citing its own note in
  one cell, 26 live occurrences across editions 2011/2017-2022), and
  the countries that stop answering freeze (the questionnaire's own
  gaps — the US absent from recent Table 9s, the same hole as Table 15).
  THE COLLECTOR'S CROSS-TABLE DEPENDENCY: these same Table 9 births are
  the denominator of Table 17's maternal mortality ratios — the UNSD
  computes both from one questionnaire, which is why this table, not a
  modeled series, is the canonical CBR.

  WITNESS TIER: one door, the minimal honest choice — WDI's WPP
  redistribution (bare code, 1960-2024, worldwide), the face the
  collector's honest partiality cannot serve (Todd's Muslim-world and
  Central-Asia comparisons live here, on the modeled layer). The WPP CBR
  is structure-carrying and vintage-unpinned (silent revisions, the same
  limit as the TFR witness); where the tiers agree it is because WPP
  anchors on the national registration series.

  HONEST SCOPE LIMITS: no 19th-century history on the canonical tier
  (the wired editions start 2007 — Todd's 30/1 000 France milestone of
  the 1870s-1910s is BOOK data, territory for the curated tier); no
  1991-2006 window (the PDF-era editions, the same deliberate boundary
  as Table 15); Russia's freeze reads on this table too where the
  questionnaire stopped.
