notes: >
  THE PINS ARE THE INDICATOR (verified live before any wiring): age
  Y15-74 (the codelist's seven bands carry NO TOTAL — a query for it
  soft-misses with HTTP 200 and an empty value object; Y15-74 is the
  LFS's own labour-force window and the de-facto total rate), unit
  PC_ACT (percentage of the labour force — the rate's denominator;
  PC_POP prints the wrong denominator, FR 2015 = 6.6), sex T (the
  both-sexes rate; the M/F splits wired in v25 under the merge key's
  sex term — FR M 2015 = 10.8, F = 9.9), freq A only (the monthly
  companion une_rt_m is refused: annualising monthly data is a
  derivation). The class doors (v25) pin the SAME age Y15-74 (the
  lfsa_urgan codelist carries 35 bands and no TOTAL — the same
  soft-miss shape) and unit PC (the datasets' only unit); the class
  dimension is open by design (the codelist as printed — the ROW-door
  discipline).

  THE COVERAGE CLIFF (the honest shape, documented per-geo by the
  probe): FR alone runs 2003-2025 (23 points, the only full-length
  series); every other EU geo + IS/NO/TR/MK start 2009; SE 2005, CH
  and RS 2010; BA starts 2021; ME (Montenegro) STOPS AT 2020. Germany
  1991-2008 lives only on the witness (DEU 1991 = 5.316, DEU 2005 =
  11.193 — the EU-LFS 15+ rate, ~3pp above the 2010s Y15-74 prints of
  the same economy: the witness's own age-base and methodology seam,
  displayed by the divergence view and explained by the root pair).
  The interwar prints of L'invention de l'Europe (Austria 1930-34)
  are book tables — territory curated, not a living wire; this
  indicator's history starts 1990 on the witness.

  THE FLAG STORY (the collector's own annotations, as-reported): b =
  break in series (DE 2010/2011/2020, the German LFS redesigns), d =
  definition differs (FR and ES 2021-2025, the LFS 2021 questionnaire
  redesign — France's series is one continuous 2003-2025 line with a
  definitional seam riding quality_code, NOT a geo seam: FX does not
  exist in this dataset, probed empty). u/bu (low reliability) hit
  small states only, none on FR/DE. No 'e'/'p' in this cube. The
  ILOSTAT witnesses print OBS_STATUS U ("Unreliable") and B ("Break in
  series") on part of their observations — transported as-reported,
  the same discipline.

  THE SEGMENT FACES' OWN HONEST SHAPE (v25): the class canonicals
  print 1995-2025 (a full 31-year series, RICHER than the plain
  rate's own 2003+ collector window — the class tables carry the
  questionnaire's longer memory), the two faces' class vocabularies
  never mix (natives/foreign_born/eu_born/non_eu_born on the birth
  layer, nationals/foreigners/eu_foreigners/non_eu_foreigners on the
  citizenship layer — ADR-0010's parallel faces), and the witnesses
  carry ONLY the two aggregate classes (CITIZEN/NONCIT, NATIVE/
  FOREIGN) at 15+ with both sexes — the ILO's class vocabulary, the
  age-base seam against the canonical's Y15-74, displayed never
  reconciled. The v17 registry's "future Destin door" verdict is
  settled honestly: the per-country by-nationality rate NO LONGER
  EXISTS on any machine wire (the ILOSTAT 2026-09-24 restructure took
  it away; the per-country counts remain, derivation-gated — the
  record in sources.yaml), so the book's own Maghreb/Turkish/
  Portuguese per-origin boards stay BOOK data (curated territory,
  the interwar-Austria line), while the questionnaire's class
  decomposition carries the étrangers/immigrés contrast live.
