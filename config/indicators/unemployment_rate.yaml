id: unemployment_rate
label: "Unemployment rate"
family: economy
unit: percent
higher_is_better: false
todd_core: true

sources:
  # THE FOURTEENTH INDICATOR (v17), the corpus's economy family's first
  # entry (20 citations, 7 books: L'invention de l'Europe's interwar
  # Austria 1930-34 and Belgian-industry prints, L'illusion économique's
  # France-3-million threshold, Qui est Charlie ?'s France >10%
  # structural claim and departmental map, Les Luttes de classes'
  # France-9-10%-vs-Germany-3-4% board, Après la démocratie's
  # France-vs-Germany 1975-2008 series, Le Destin des immigrés'
  # by-nationality FRG-1987 question — the last one wired in v25, see the
  # segment faces below).
  #
  # THE CANONICAL FINDING (the v17 probe verdict, verified live
  # 2026-09-20 before any config): NO other wire prints the plain
  # national rate at the collector tier. ILOSTAT is wholesale
  # ILO-PROCESSED material — 2EAP/2UNE is ILOEST (modeled estimates,
  # "imputed observations... subject to high uncertainty"), 5EAP/5UNE is
  # the 19th-ICLS WORK harmonization ("may differ from official national
  # figures"), DEAP/TUNE is the LFS/ILMS database family whose rows
  # carry "Repository: ILO-STATISTICS - Micro data processing" and
  # LFS-ADJ adjusted series (Germany's own rows are the EU-LFS and its
  # adjusted variant, not the Bundesagentur print) — every flow
  # witness-only by constitution. The OECD doors are OECD-harmonized
  # (LFS_INDIC / IALFS_UNE_M, the latter's own description documents
  # OECD re-timing the UK's rolling quarters) or registered-unemployment
  # counts ("not comparable across countries" per the flow's own
  # description). Eurostat's une_rt_a is the one collector: the rate
  # each national statistical office computes from its own LFS,
  # collected by the questionnaire, printed at the 1-decimal
  # as-published face.
  - provider: eurostat
    ref: une_rt_a/Y15-74/PC_ACT/T
    priority: 1
    role: canonical
    root: eurostat_lfs

  # THE BY-SEX FACE (v25, the v17 registry's "one ref away" doors wired):
  # the M and F ventilations of the SAME rate on the SAME door — the
  # merge key's sex component discriminates them from the T rows, the
  # v24 migration pattern applied to the single-axis face. FR 2015
  # M = 10.8, F = 9.9 (the v17 probe anchors, re-verified live at the
  # v25 probe). The priorities are nominal (the T/M/F rows are disjoint
  # by sex, arbitration never fires across them).
  - provider: eurostat
    ref: une_rt_a/Y15-74/PC_ACT/M
    priority: 3
    role: canonical
    root: eurostat_lfs
  - provider: eurostat
    ref: une_rt_a/Y15-74/PC_ACT/F
    priority: 4
    role: canonical
    root: eurostat_lfs

  # THE WITNESS (worldwide): WDI's SL.UEM.TOTL.NE.ZS, "Unemployment,
  # total (% of total labor force) (national estimate)" — the
  # national-estimate line, which the v17 probe fingerprinted as the
  # ILOSTAT DEAP plain-rate family redistributed by WDI (byte-identical
  # to DF_UNE_DEAP_SEX_AGE_RT on the co-covered core: FRA 1992 = 10.203
  # on both doors). NE over ZS (the modeled-ILO-estimate code, recorded
  # unwired in sources.yaml): NE covers 208 real countries including
  # XKX Kosovo versus 187, one more year (1990 versus 1991), and the
  # as-reported-at-source face; for FRA/DEU/USA the two codes currently
  # print identical values, so nothing is lost and the 45.8% NE-vs-ZS
  # cell divergence (BHR 1998: 43.156 vs 1.114) stays outside the core
  # where it belongs. This door also carries what the collector lacks:
  # the 1990-2002 France and 1991-2008 Germany years (the Eurostat cube
  # starts FR at 2003, everyone else at 2009 — the coverage cliff
  # documented per-geo in the probe record).
  - provider: worldbank
    ref: SL.UEM.TOTL.NE.ZS
    priority: 2
    role: witness
    root: ilo_lfs

  # THE SEGMENT FACES (v25) — Le Destin des immigrés' own question wired
  # at the collector tier: the CLASS decomposition of the same rate
  # (étrangers vs nationaux, immigrés vs non-immigrés), each face its own
  # dist layer under the (entity, class, year, sex) key, parallel never
  # merged (the ADR-0010 doctrine). CANONICAL = the LFS questionnaire's
  # own class tables, the doors the v25 probe found (the v17 registry
  # had looked for this decomposition on ILOSTAT and recorded the
  # harmonized family as the future door — the collector print was
  # sitting in the LFS domain all along):
  # - lfsa_urgacob "Unemployment rates by country of birth" — the
  #   BIRTH face (immigrés): natives / foreign_born / eu_born /
  #   non_eu_born, 36 geos printing at Y15-74/T (3,023 cells),
  #   1995-2025. FR 2015: natives 9.4 vs foreign_born 17.1, EU-born
  #   10.7 vs non-EU-born 19.0 (the Destin contrast at the aggregate
  #   level — the book's Portuguese-vs-Maghreb split in the
  #   questionnaire's own classes).
  # - lfsa_urgan "Unemployment rates by citizenship" — the CITIZENSHIP
  #   face (étrangers): nationals / foreigners / eu_foreigners /
  #   non_eu_foreigners, 35 geos at Y15-74/T (2,710 cells), 1995-2025.
  #   FR 2015: nationals 9.7 vs foreigners 20.5, EU-foreigners 12.6 vs
  #   non-EU-foreigners 24.5 — the étrangers-over-nationals ratio the
  #   book's unemployment chapters read, the de-facto Destin board.
  # THE TOTAL class drops on both doors (the total rate rides une_rt_a —
  # one door per face), STLS/NRP drop logged (the residuals); the UK
  # prints here (lost to une_rt_a at Brexit — the class door's own
  # richer codelist). Root: eurostat_lfs (the same questionnaire — one
  # questionnaire, four metrics now).
  - provider: eurostat
    ref: lfsa_urgacob/Y15-74/T
    priority: 5
    role: canonical
    root: eurostat_lfs
  - provider: eurostat
    ref: lfsa_urgan/Y15-74/T
    priority: 6
    role: canonical
    root: eurostat_lfs

  # THE SEGMENT WITNESSES (v25): the ILOSTAT class-decomposition flows
  # on the ILO's own SDMX wire — the SAME ilo_lfs root the plain rate's
  # WB witness redistributes, read directly. THE FLOW RESTRUCTURE THE
  # v25 PROBE FOUND (the registry's own verdict): the flows' 2026-09-24
  # update took the per-country detail away and left the class prints —
  # CITIZEN/NONCIT on CCT, NATIVE/FOREIGN on CBR — a WORLD CROSS-SECTION
  # (137 areas on the citizenship flow at SEX_T/YGE15, 145 on the birth
  # flow, ~1 observation per series: the coupe pattern RS_198 and
  # PRISON_A2 set). The witnesses carry the two class codes each (the
  # EU/non-EU split is the Eurostat canonical's own vocabulary the ILO
  # never printed), at AGE_AGGREGATE_YGE15 (15+ — the age-base seam
  # against the canonical's Y15-74, the DE-1991-2008 seam's own class),
  # and BOTH SEXES (SEX open in one door — the by-sex ventilations ride
  # the witness's own shape while the canonical's M/F segment doors
  # stay unwired, recorded). FR 2025 anchors (verified live): nationals
  # 7.162 vs foreigners 13.902 (CCT), natives 7.023 vs foreign_born
  # 12.003 (CBR) — the same étrangers/immigrés contrast the collector
  # prints, one harmonization step apart, displayed never reconciled.
  # The flow's own annotations ride the evidence: SOURCE "LFS - Enquête
  # sur l'emploi" (the v17 fingerprint), the NOTE_SOURCE repository mix
  # (309 "ILO-STATISTICS - Micro data processing" vs 63 "Eurostat
  # special tabulation" on the cross-section's 461 observations — the
  # harmonized tier's heterogeneous genealogy, read live, never
  # interpreted).
  - provider: ilostat
    ref: DF_UNE_DEAP_SEX_AGE_CBR_RT
    priority: 7
    role: witness
    root: ilo_lfs
  - provider: ilostat
    ref: DF_UNE_DEAP_SEX_AGE_CCT_RT
    priority: 8
    role: witness
    root: ilo_lfs

coverage_start: 1990
coverage_end: 2025

reliability: high
reliability_criteria: >
  Canonical tier = Eurostat une_rt_a pinned age=Y15-74/unit=PC_ACT/
  sex=T (the LFS questionnaire's own broadest band — the codelist
  carries no TOTAL; unit PC_ACT is the rate's own denominator, not
  PC_POP; 1-decimal as published), 38 geos (EU + EFTA + Western
  Balkans + Turkiye; no UK — post-Brexit the door stopped carrying it),
  2003-2025, 635 valued cells, the collector's b/d flags transported
  as-reported on quality_code (d on FR and ES 2021-2025: the 2021 LFS
  questionnaire redesign — a definitional seam the connector surfaces,
  not a geo seam; b = break in series; no provisional codes in this
  dataset), PLUS the M/F ventilations of the same door (v25: the sex
  merge-key rows, one pin away each — FR M 2015 = 10.8, F = 9.9) and
  the two CLASS-decomposition canonical doors (v25: lfsa_urgacob and
  lfsa_urgan at the same Y15-74 pin, unit PC the datasets' only unit,
  the class dimension open — 36/35 printing geos, 1995-2025, the
  étrangers/immigrés boards of Le Destin des immigrés at the collector
  tier). Witness tier = the WB national-estimate line, 208 countries
  1990-2025, 0-3 decimals as printed, PLUS the ILOSTAT class
  cross-sections (v25: CITIZEN/NONCIT and NATIVE/FOREIGN at 15+, 137/145
  areas, ~1 observation per series — the coupe pattern, SOURCE "LFS -
  Enquête sur l'emploi" and the micro-data-processing repository mix
  the flow's own annotations carry). Root pair eurostat_lfs/ilo_lfs:
  same underlying national surveys, one harmonization step apart — on
  the co-covered core they print the same rates to rounding (FR 2015:
  10.4 vs 10.354), and the seams the pair displays (FR 2024 7.436 vs
  7.4 rounding; DE 2005 11.193 on the witness vs ABSENT on the
  collector) read as two doors, never a contradiction.
reclassification_sensitive: false

plausible_range:
  min: 0     # the floor is structural (any LFS can print a 0.x rate in
             # principle; the observed minimum is single-digit)
  max: 90    # the observed span: the collector's max is the Greek crisis
             # (EL 2013 = 27.8, ES 2013 = 26.1); the single-axis witness
             # carries the post-war break values (XKX 2001 = 57.0) and
             # BHR 1998 = 43.156; the v25 ILOSTAT class witnesses extend
             # the tail further — IRQ 2021 female foreigners = 88.1 (a
             # crisis print) and ITA 2001 = 73.8-78.5 on every class
             # (the ILO flow's own odd Italian vintage, an outlier the
             # divergence display shows as-reported, never corrected) —
             # 90 admits the whole tail while a unit error (a count, a
             # share of population) or a misload of the monthly family
             # flags immediately.

