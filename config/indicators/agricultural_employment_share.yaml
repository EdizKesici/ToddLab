id: agricultural_employment_share
label: "Agricultural employment share"
family: economy
unit: percent
higher_is_better: false
todd_core: true

sources:
  # THE SEVENTEENTH INDICATOR (v18) — 2 citations, 1 book (Le Destin
  # des immigrés: "Agricultural employment/population share (Britain
  # 1841, USA 1841, Turkey 1985)" — the agrarian-exodus baseline the
  # immigration boards read against). Wired WITH industrial (v18): the
  # same national-accounts door, the same dispatch, the nace=A pin —
  # the agricultural share the door prints directly at PC_TOT_PER
  # (FR 1995 = 4.4 -> 2024 = 2.3, verified live 2026-09-21).
  - provider: eurostat
    ref: nama_10_a10_e/EMP_DC/PC_TOT_PER/A
    priority: 1
    role: canonical
    unit: percent
    root: eurostat_na

  # THE WITNESS (worldwide): WB SL.AGR.EMPL.ZS, "Employment in
  # agriculture (% of total employment) (modeled ILO estimate)" — the
  # same ILOSTAT 2EMP modeled family as industrial's witness, world
  # coverage. The agriculture share is the DEFINITIONALLY cleanest of
  # the pair (NACE A vs ISIC A/B alignment is near-exact; no
  # construction-type seam), so the two doors converge tightly on the
  # co-covered core — the pair's quiet control beside industrial's
  # displayed seam.
  - provider: worldbank
    ref: SL.AGR.EMPL.ZS
    priority: 2
    role: witness
    root: ilo_modelled

coverage_start: 1975
coverage_end: 2025

reliability: high
reliability_criteria: >
  Canonical tier = Eurostat nama_10_a10_e pinned na_item=EMP_DC,
  unit=PC_TOT_PER, nace_r2=A ("Agriculture, forestry and fishing" —
  the door's own aggregate label): same universe and discipline as
  industrial (34 countries, aggregates dropped logged incl. the EA
  two-letter edge, no sex dimension, FR 1995-2024 full annual series
  4.4 -> 2.3). Witness tier = the ILO modeled agriculture shares,
  world 1991-2024. Root pair eurostat_na/ilo_modelled.
reclassification_sensitive: false

plausible_range:
  min: 0
  max: 90    # the canonical's own span bottoms near FR 2024 = 2.3; the
             # witness's world face legitimately prints the 60-80s (the
             # agrarian economies of the Sahel and South Asia — Todd's
             # own La troisième planète terrain); 90 admits the tail
             # while a unit error or a misload of the counts face flags
             # immediately.

license: >
  Eurostat reuse policy (attribution required, no endorsement implied);
  World Bank WDI CC-BY-4.0 — see docs/licenses.md.

notes: >
  The honest face of the corpus's smallest economy metric: Todd's
  1841 Britain / 1841 USA / 1985 Turkey prints are census-era BOOK
  tables (curated territory), the living wire covers the accounts
  universe 1995-2024 (per-country start years vary — the canonical
  clips at each country's own NA start), and the world/witness face
  carries the agrarian South the accounts universe lacks. The same
  door as industrial: one nace pin away, the probe record shared, the
  construction-seam question absent (agriculture is definitional
  everywhere). The SEX-AGE detail doors (lfsa_egan2's A split, the
  SAL_DC/SELF_DC items) are recorded unwired in sources.yaml with
  industrial's.
