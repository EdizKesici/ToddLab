id: maternal_deaths
label: "Maternal deaths"
family: mortality
unit: maternal_deaths
higher_is_better: false
todd_core: false

sources:
  # ADR-0008 applied to the sixth indicator (v12, the counts half of the
  # maternal bloc): canonical = the collector's Number rows (UN DYB Table
  # 17 "Number - Nombre": registered maternal deaths, the WHO-collected
  # cause-of-death statistics the UN Statistics Division also computes the
  # ratio from), witness = the UN MMEIG modeled NUMBER of maternal deaths
  # via the World Bank (SH.MMR.DTHS, the 2023 round, annual 1985-2023).
  # This indicator exists because the counts block is WIDER than the ratio
  # block by the collector's own editorial rule: Number rows are published
  # for countries where no Rate row is computed at all (Libya in the 2024
  # edition: 12 deaths in 2016, no ratio) — the v9 yaml documented that
  # scope limit with "wiring the counts as a second indicator is a separate
  # decision"; v12 is that decision. 13 wired editions, same loop as the
  # ratio indicator (2011-2015 + 2017-2024; 2015 recovered v10, 2016
  # FILEPASS-encrypted and deliberately absent, zero coverage loss).
  - provider: un_dyb
    ref: 2024/table17
    field: number
    priority: 1
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2023/table17
    field: number
    priority: 2
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2022/table17
    field: number
    priority: 3
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2021/table17
    field: number
    priority: 4
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2020/table17
    field: number
    priority: 5
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2019/table17
    field: number
    priority: 6
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2018/table17
    field: number
    priority: 7
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2017/table17
    field: number
    priority: 8
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2015/table17
    field: number
    priority: 9
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2014/table17
    field: number
    priority: 10
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2013/table17
    field: number
    priority: 11
