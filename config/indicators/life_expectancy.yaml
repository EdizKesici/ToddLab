  - provider: owid
    ref: life-expectancy
    priority: 15
    role: witness
    root: owid_longrun_composite
  # v11 (P5): the World Bank's sex-split LE codes (the .MA.IN/.FE.IN
  # suffix convention) — pure UN WPP estimates, the witness the sex-split
  # canonical tier was missing: Russia 1994 male = 57.55 where the DYB
  # collector is absent, and 64.56 in 2012 exactly matching the collector's
  # own last Russian life table (verified live). Rounded to at most one
  # decimal (the WDI print, same honest coarseness as the IMR codes).
  - provider: worldbank
    ref: SP.DYN.LE00.MA.IN
    priority: 16
    role: witness
    root: un_wpp
  - provider: worldbank
    ref: SP.DYN.LE00.FE.IN
    priority: 17
    role: witness
    root: un_wpp

coverage_start: 1971  # v21: the DYB 1978 curated vanished-entities tables (end-year convention: 1971-1972 prints)
coverage_end: 2024

reliability: high
reliability_criteria: >
  Canonical tier = UN DYB Table 4, national official statistics as
  reported, 13 editions (2015 recovered v10), 2007-2024, sex-split (Male/Female) as printed by
  the collector; witness tier = OWID "life expectancy" (the mixed
  long-run compilation — Riley, HMD, UN WPP — both sexes) and the World
  Bank SP.DYN.LE00.MA/FE codes (pure UN WPP, sex-split), near-global.
  Authenticity first per ADR-0008: displayed beside each other, never
  blended.
reclassification_sensitive: false

plausible_range:
  min: 0
  max: 100

license: >
  Mixed, per source (see "sources"): UN DYB = UN data reuse policy
  (attribution required, no endorsement implied); OWID witness =
  CC-BY-4.0; World Bank witness = CC-BY-4.0.
notes: >
  THE SEX DIMENSION (the honest cost of the as-reported route): the DYB
  collector prints life expectancy at birth for Male and Female
  separately — there is no "both sexes" column to report, and averaging
  the two would be a derivation (the canonical tier reports, it does not
  derive). Every canonical point therefore carries sex="male"|"female"
  and (entity, year, sex) is the merge key. The OWID witness is
  both-sexes: it stays comparable at the SERIES level (its both-sexes
  level sits between the two canonical curves), not pointwise. Since v11
  the World Bank witnesses ARE sex-split (SP.DYN.LE00.MA/FE): the
  male/female witness curves the sex-split canonical lacked — the
  Russian sex gap in life expectancy, one of Todd's standing exhibits,
  can now be read collector-vs-model curve to curve, not only against a
  both-sexes line. A both-sexes canonical series would be a derived
  product, explicitly out of scope until a separate decision says
  otherwise.

  CANONICAL TIER: un_dyb Table 4, editions 2011-2015 + 2017-2024 (the
  2015 vintage recovered in v10 via the legacy URL pattern) —
  as-reported LE at birth over 2007-2024, overlapping windows
  reconstructed edition by edition, intra-tier arbitration (later
  vintage wins, logged in provenance.json). Collector holes are data:
  countries absent from the table's windows (no questionnaire response
  or no civil-registration LE that year) stay absent — Russia included,
  which is why the WPP witness (WB codes) carries Russia's full series
  where the collector freezes. The pre-2007 as-reported history lives
  in the PDF-era editions — deliberately NOT in this loop (ADR-0007's
  PDF-route gate).

  WITNESS TIER: two DIFFERENT harmonized roots, deliberately both wired:
  - owid `life-expectancy` — "over the long-run" series combining
    historical reconstructions (Riley, HMD) with UN WPP estimates,
    methodologically heterogeneous by period (root:
    owid_longrun_composite); check n_missing_within_span per country in
    reports/coverage_report.md before using this series for a given
    country over a long span.
  - worldbank SP.DYN.LE00.MA.IN / SP.DYN.LE00.FE.IN — pure UN WPP
    (root: un_wpp), sex-split, 1960-2024, rounded to one decimal (the
    WDI print). Where the two witnesses disagree, the difference is the
    Riley/HMD-vs-WPP genealogy showing — display material, not an error
    to reconcile.

  Life expectancy at 60 is its own indicator since v10 (life_expectancy_60,
  DYB Tables 21/22 + a GHO witness) — see its config for the
  cross-section semantics of the by-age tables.
