id: life_expectancy
label: "Life expectancy at birth"
family: mortality
unit: years
higher_is_better: true
todd_core: true

sources:
  # ADR-0008 applied to the second pilot indicator (P1): the canonical
  # series is the as-reported collector tier (UN DYB Table 4), the
  # harmonized layer (OWID/UN WPP) is the witness. Among the DYB editions:
  # later edition = later vintage = higher priority (standard vintage
  # discipline, arbitrations logged in {indicator}.provenance.json).
  # Editions 2015 (dead XLS links) and 2016 (FILEPASS-encrypted) are
  # deliberately absent — verified live 2026-09-06, no coverage loss (see
  # config/sources.yaml un_dyb notes).
  - provider: un_dyb
    ref: 2024/table04
    priority: 1
    role: canonical
  - provider: un_dyb
    ref: 2023/table04
    priority: 2
    role: canonical
  - provider: un_dyb
    ref: 2022/table04
    priority: 3
    role: canonical
  - provider: un_dyb
    ref: 2021/table04
    priority: 4
    role: canonical
  - provider: un_dyb
    ref: 2020/table04
    priority: 5
    role: canonical
  - provider: un_dyb
    ref: 2019/table04
    priority: 6
    role: canonical
  - provider: un_dyb
    ref: 2018/table04
    priority: 7
    role: canonical
  - provider: un_dyb
    ref: 2017/table04
    priority: 8
    role: canonical
  - provider: un_dyb
    ref: 2014/table04
    priority: 9
    role: canonical
  - provider: un_dyb
    ref: 2013/table04
    priority: 10
    role: canonical
  - provider: un_dyb
    ref: 2012/table04
    priority: 11
    role: canonical
  - provider: un_dyb
    ref: 2011/table04
    priority: 12
    role: canonical
  - provider: owid
    ref: life-expectancy
    priority: 13
    role: witness

coverage_start: 2007
coverage_end: 2024

reliability: high
reliability_criteria: >
  Canonical tier = UN DYB Table 4, national official statistics as
  reported, 12 editions, 2007-2024, sex-split (Male/Female) as printed by
  the collector; witness tier = OWID "life expectancy" (UN WPP estimates
  and historical reconstructions — Riley, HMD — both sexes), near-global,
  longer span (to 1875 for some entities). Authenticity first per
  ADR-0008: displayed beside each other, never blended.
reclassification_sensitive: false

plausible_range:
  min: 0
  max: 100

license: >
  Mixed, per source (see "sources"): UN DYB = UN data reuse policy
  (attribution required, no endorsement implied); OWID witness =
  CC-BY-4.0.
notes: >
  THE SEX DIMENSION (the honest cost of the as-reported route): the DYB
  collector prints life expectancy at birth for Male and Female
  separately — there is no "both sexes" column to report, and averaging
  the two would be a derivation (the canonical tier reports, it does not
  derive). Every canonical point therefore carries sex="male"|"female"
  and (entity, year, sex) is the merge key. The OWID witness is
  both-sexes: it stays comparable at the SERIES level (its both-sexes
  level sits between the two canonical curves), not pointwise. A
  both-sexes canonical series would be a derived product, explicitly
  out of scope until a separate decision says otherwise — and the
  male/female split is itself a Todd-relevant signal (the Russian sex
  gap in life expectancy is one of his standing exhibits).

  CANONICAL TIER: un_dyb Table 4, editions 2011-2014 + 2017-2024 —
  as-reported LE at birth over 2007-2024, overlapping windows
  reconstructed edition by edition, intra-tier arbitration (later
  vintage wins, logged in provenance.json). Collector holes are data:
  countries absent from the table's windows (no questionnaire response
  or no civil-registration LE that year) stay absent. The pre-2007
  as-reported history lives in the PDF-era editions — deliberately NOT
  in this loop (ADR-0007's PDF-route gate).

  WITNESS TIER: owid `life-expectancy` — "over the long-run" series
  combining historical reconstructions (Riley, HMD) with UN WPP
  estimates, methodologically heterogeneous by period; check
  n_missing_within_span per country in reports/coverage_report.md
  before using this series for a given country over a long span.

  Life expectancy at 60 (mentioned in the brief as a companion
  indicator) deliberately absent from this pilot — DYB Table 21 ("Life
  expectancy at specified ages", latest-year cross-sections, 2005+) is
  the identified as-reported route; to add in phase 2/3 as a companion
  indicator.
