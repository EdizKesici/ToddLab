id: life_expectancy
label: "Life expectancy at birth"
family: mortality
unit: years
higher_is_better: true
todd_core: true

sources:
  # v21: the DYB 1978 vanished-entities transcription (the PDF route),
  # sex-split as the modern Table 4 loop prints it: the USSR 1971-1972
  # (M 64 / F 74 — the UNION-level print of the founding claim's era, at
  # the print's integer precision), the Byelorussian SSR 1970-1971
  # (68/76), the Ukrainian SSR 1970-1971 (67/74), Czechoslovakia 1976
  # (66.99/74.05), the GDR 1976 (68.82/74.42), Yugoslavia SFR 1970-1972
  # (65.42/70.22 — corroborated Table 4 == Table 22 age-0). The point's
  # year = the END year of the printed reference period (the Table 21/22
  # convention); the period string rides reference_range as-reported.
  # The Yemen prints are EXCLUDED: footnote 4 marks them Population
  # Division estimates — witness-class by constitution (sources.yaml).
  - provider: curated
    ref: dyb1978_vanished_life_expectancy
    priority: 1
    role: canonical
    root: unsd_dyb
  # ADR-0008 applied to the second pilot indicator (P1): the canonical
  # series is the as-reported collector tier (UN DYB Table 4), the
  # harmonized layer is the witness. Among the DYB editions: later
  # edition = later vintage = higher priority (standard vintage
  # discipline, arbitrations logged in {indicator}.provenance.json).
  # Edition 2016 (FILEPASS-encrypted) is deliberately absent — verified
  # live 2026-09-06, no coverage loss (see config/sources.yaml un_dyb
  # notes). Edition 2015 was recovered in v10 through the legacy URL
  # pattern (its window 2011-2015 now has its own vintage).
  #
  # `root` (v11, the genealogy field): the two LE witnesses carry
  # DIFFERENT roots on purpose — OWID's long-run series is a mixed
  # compilation (Riley/HMD historical + WPP modern), the World Bank's is
  # pure UN WPP. Two harmonized roots, not one: the genealogy says so,
  # and the divergences between them are display material.
  - provider: un_dyb
    ref: 2024/table04
    priority: 2
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2023/table04
    priority: 3
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2022/table04
    priority: 4
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2021/table04
    priority: 5
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2020/table04
    priority: 6
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2019/table04
    priority: 7
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2018/table04
    priority: 8
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2017/table04
    priority: 9
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2015/table04
    priority: 10
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2014/table04
    priority: 11
    role: canonical
