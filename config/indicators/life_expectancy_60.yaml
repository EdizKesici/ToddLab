id: life_expectancy_60
label: "Life expectancy at age 60"
family: mortality
unit: years
higher_is_better: true
todd_core: false

sources:
  # ADR-0008 applied to the fifth indicator (v10): canonical = the collector
  # (UN DYB "Life expectancy at specified ages for each sex", the table whose
  # NUMBER alternates — 21 in even editions, 22 in odd ones; both wired per
  # edition below), witness = the WHO GHO WHOSIS_000015 modeled estimates
  # (WPP-derived — the piece of phase 5 pulled forward because this indicator
  # needed a witness and OWID publishes no age-60 chart, its by-age charts
  # jump 45 -> 65). `field` selects the AGE column ("60"); the snapshots
  # hold that column's records only — the 20 other ages mean another
  # indicator + config + a re-fetch of the same tables.
  - provider: un_dyb
    ref: 2024/table21
    field: "60"
    priority: 1
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2023/table22
    field: "60"
    priority: 2
    role: canonical
    root: unsd_dyb
  - provider: un_dyb
    ref: 2022/table21
    field: "60"
    priority: 3
    role: canonical
    root: unsd_dyb
