id: infant_mortality
label: "Infant mortality"
family: mortality
unit: deaths_per_1000_births
higher_is_better: false
todd_core: true

sources:
  # ADR-0008 (Technique A, decided in conversation): the Todd board's
  # canonical series is the AS-REPORTED tier — curated official series
  # (L0-L2) + collectors (L1-collector) — with the harmonized layer as
  # witness, never merged. Priorities arbitrate WITHIN the canonical tier
  # only. Among the DYB editions the rule is: later edition = later
  # vintage = higher priority (standard vintage discipline); every
  # arbitration between overlapping windows is logged in
  # {indicator}.provenance.json.
  #
  # `root` (v11) is the genealogy field: the ultimate origin a source
  # redistributes. On this indicator it settles the founding case of
  # docs/the-measurement-problem.md section 1 — the four agreeing
  # witnesses (OWID, WB x2, GHO) are ONE UN IGME root seen through four
  # doors, not four confirmations.
  - provider: curated
    ref: ussr_infant_mortality_official
    priority: 1
    role: canonical
    unit: deaths_per_1000_births
    root: soviet_official
  # 13 wired editions: 2015 recovered in v10 through the legacy URL
  # pattern (verified live 2026-09-13); 2016 (FILEPASS-encrypted) remains
  # deliberately absent, no coverage loss (see config/sources.yaml un_dyb
  # notes). field=rate: IMR per 1,000 live births, the DYB's native unit
  # (= the canonical unit here).
  - provider: un_dyb
