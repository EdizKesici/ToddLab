coverage_start: 1990
coverage_end: 2025

reliability: high
reliability_criteria: >
  Canonical tier = Eurostat migr_pop3ctb pinned c_birth=FOR (the
  foreign-born total — "Foreign country"), age=TOTAL, sex=T, unit=NR
  (the dataset's only unit, pinned and guarded): 44 countries
  (aggregates dropped logged), the door's own per-country starts
  (Ireland 2000, Italy/Lithuania/Spain 2002, France 2007 — the FR
  series annual 2007-2025, census-aligned) with the collector's
  b/e/p flags as-reported. Since v22 the SAME collector tier carries
  the by-origin face: the 30 wired Eurostat ROW doors (c_birth open,
  the 307-code by-birth codelist as printed; aggregates, the
  FOR/NAT/TOTAL/OTH/UNK/RNC summary codes and the native diagonal
  dropped logged per class), as each country's own registration
  prints it. Since v23 the LEGAL twin rides beside it on the same
  collector judgment: the 34 Eurostat migr_pop1ctz ROW doors
  (citizen open, the 287-code by-citizenship codelist as printed;
  aggregates, the NAT/RNC/TOTAL/OTH/UNK summary codes, STLS stateless
  and the native diagonal dropped logged per class) — the face's own
  geography (Germany in, Cyprus out) carried as-printed. Witness
  tiers = the UN DESA migrant-stock estimates via WDI (world
  1990-2024, the total face), the OECD migration questionnaire's
  foreign-born matrix (v22, DSD_MIG_F@DF_MIG_POPF, 38 destinations x
  the BIRTH_COUNTRY codelist, SEX=_T) and its citizenship twin (v23,
  DSD_MIG@DF_MIG measure B15, 36 destinations x the CITIZENSHIP
  codelist, SEX=_T — the two questionnaires agreeing to the unit on
  the co-covered core). Root pair eurostat_migr/un_desa/oecd_mig:
  the registrations, the compiled estimates of the same stock, and
  the OECD-compiled questionnaire answers — one estimation/
  compilation step apart each.
reclassification_sensitive: false

plausible_range:
  min: 0
  max: 60000000   # the world's largest foreign-born stocks print in the
                 # 50s of millions (US 2024 class; the by-origin US<-W
                 # World row rides the same head — dropped logged on the
                 # OECD door, the bound admits any per-origin print that
                 # remains); 60M admits that head while a unit error (a
                 # share, a rate, a flow) or a misload of the NAT/TOTAL
                 # c_birth doors flags immediately.

license: >
  Eurostat reuse policy (attribution required, no endorsement implied);
  World Bank WDI CC-BY-4.0; OECD Terms and Conditions, attribution
  required — see docs/licenses.md.

notes: >
  THE TODD BY-ORIGIN QUESTION, WIRED (v22): Todd's boards are
  BILATERAL — the stock of Moroccans/Turks/Portuguese IN
  France/Germany/UK — and the indicator now carries the matrix beside
  its total: the dist's `bilateral` layer (destination_entity_id x
  origin_entity_id x year, additive — the (entity, year) data and
  witnesses stay bit-identical). Canonical = the 30 Eurostat ROW
  doors; witness = the OECD matrix. THE SEAM, verified to the unit:
  the two questionnaires agree exactly on the co-covered core
  (FR<-MA 2015 = 954,742 on BOTH doors; 2018 = 992,120 both sides)
  and the OECD face extends the French Maghreb series past the
  Eurostat 2018 cutoff (2019 = 1,009,605, 2021 = 1,036,133) — the
  compilation seam displayed, never reconciled. THE ANCHORS the
  book's own tables read: FR<-DZ 1999 = 1,246,706 -> 2018 =
  1,390,284, FR<-TR -> 256,684, FR<-PT 1999 = 579,465 -> 2025 =
  599,492; the world face the Eurostat universe cannot print:
  US<-MEX 12,383,868 (2024). THE VANISHED ORIGINS, admitted (the
  v21 class): both doors keep printing the withdrawn codes as birth
  places — Eurostat AN (Netherlands Antilles), the OECD _F prints
  (CSK_F/SUN_F/YUG_F/SCG_F/ANT_F) — each landing on its vanished
  entity through its withdrawn ISO3 (the kosovo/XKX precedent); a
  stock point's year is the MEASUREMENT year, never the birth year,
  so the origin axis deliberately skips the entity validity guard
  (people born in Czechoslovakia, counted in Germany in 2015, are
  the as-printed classification). THE CITIZENSHIP FACE, WIRED (v23):
  the LEGAL twin — étrangers vs immigrés, the second board of Le
  Destin des immigrés — rides the dist's `bilateral_citizenship`
  layer, PARALLEL to the birth face and NEVER merged with it
  (ADR-0010: the two faces are different legal questions; the merge
  key (destination, origin, year, sex) is shared, the key SPACES are
  separate). Canonical = the 34 Eurostat migr_pop1ctz ROW doors; the
  v18 anchor disambiguation landed: FR<-MA ctz 2015 = 458,561 (the
  birth face prints 954,742 — two legalities of the same stock).
  Witness = the OECD DSD_MIG@DF_MIG B15 matrix (the sibling flow's
  citizenship face; the two questionnaires agreeing to the unit,
  FR<-MAR _T 2015 = 458,561 on both doors). THE CONTRAST ANCHORS the
  two faces exist to display (both live-verified 2026-09-25):
  CONVERGE FR<-PT 2015 = 648,112 born vs 541,867 citizens; DIVERGE
  FR<-MA 2015 = 954,742 born vs 458,561 citizens; the world face
  US<-MEX 2024 = 12,383,868 born vs 8,226,106 citizens. THE FACE'S
  OWN GEOGRAPHY, as-printed (never "corrected"): Germany joins the
  citizenship face (the birth face's totals-only honest absence),
  Cyprus leaves it; EL/ME/MD/AD print census cross-sections; the
  stateless residual (STLS) and the same vanished-entity admission
  (AN, the OECD _F prints) ride the shared override tables. THE
  HISTORICAL FACE: Todd's 1946-1990 boards are census-era BOOK tables
  (the censuses themselves are the collector, print-era), territory
  curated. THE UK COVERAGE: the door carries the UK through the
  post-Brexit years with its own honest gaps (per-geo start years
  vary — the same coverage-cliff discipline unemployment's UK
  carries); the by-origin detail thins post-2018 (~26 origins
  printing for FR against 138 in 2015) while the totals keep
  printing — the honest as-printed shape. THE REMAINING UNWIRED
  FACES, recorded: by-sex (both doors print it — the OECD B15 pull
  already carries the 104,009 F rows, the V24 hook), age bands
  (Eurostat), the single-axis ctz foreigners-total door, the DESA
  bilateral matrix (manual-download), the OWID US-by-CoB historical
  chart (1850+, the census-era US face).
