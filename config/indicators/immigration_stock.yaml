  # THE BY-ORIGIN WITNESS (v22): OECD DSD_MIG_F@DF_MIG_POPF, "International
  # migration database - stocks of foreign-born population" — the OECD
  # migration questionnaire's own bilateral matrix (REF_AREA x
  # BIRTH_COUNTRY, both axes ISO3), the OECD-COMPILED face of the same
  # national registrations (the oecd_family relation). The door serves only
  # through the empty-key /all download (positional keys 404, verified
  # live); the parser pins the SEX=_T frame (the F rows drop logged — the
  # by-sex face recorded unwired) and drops the residual vocabulary
  # (W/W_X/EEA/EU15/A4/STLS) and the diagonal, logged per class. THE SEAM,
  # verified to the unit: OECD FR<-MAR _T 2015 = 954,742 = the Eurostat
  # c_birth print EXACTLY (2018 = 992,120 both sides) — agreement that
  # reads like confirmation unless the genealogy says both doors walk back
  # to the same national registrations. And the OECD face EXTENDS the
  # canonical universe: the FR Maghreb series 2019-2021 past the Eurostat
  # 2018 cutoff (FR<-MAR 2021 = 1,036,133), the vanished-entity origins
  # (CSK_F/SUN_F/YUG_F/ANT_F/SCG_F — the by-origin face of the v21
  # admission), and the world's non-European destinations the 45-geo
  # Eurostat codelist structurally cannot print (US<-MEX 12,383,868 in
  # 2024, US<-W 51,226,993 the World-total row the witness drops logged).
  - provider: oecd
    ref: DF_MIG_POPF
    priority: 33
    role: witness
    unit: persons
    root: oecd_mig

  # THE BY-CITIZENSHIP FACE (v23) — the LEGAL twin of the by-origin face:
  # the bilateral (destination x citizenship) decomposition of the FOREIGN
  # POPULATION (étrangers), in mirror of the by-birth face above
  # (immigrés). Todd's own pair of boards: the two legalities of the same
  # stock — born-abroad vs holding-the-nationality — DIVERGE exactly where
  # naturalization runs ahead of the census (FR<-MA 2015: 954,742 born vs
  # 458,561 citizens, both verified live) and CONVERGE where it rarely
  # does (FR<-PT 2015: 648,112 born vs 541,867 citizens). Canonical = the
  # 34 destination ROWS of migr_pop1ctz that PRINT the by-citizenship
  # detail (one geo-pinned ref each, citizen UNPINNED = the 287-code
  # by-citizenship codelist as printed: 226 country codes + the
  # NAT/RNC/TOTAL/OTH/UNK summary codes + STLS stateless + 55 aggregates/
  # regions, each dropped logged per class; the diagonal citizen == geo
  # — the native-CITIZEN face — drops logged too). THE FACE'S OWN
  # GEOGRAPHY, verified live 2026-09-25 (all 44 candidate geos probed):
  # 34 destinations print the detail — 29 of the birth face's 30 (Cyprus
  # leaves: 222 cells, every one an aggregate or summary — the totals-
  # only class) + Germany (JOINS: 6,400 cells, 5,498 country cells — the
  # citizenship questionnaire carries what the birth questionnaire's
  # honest absence never printed) + EL/ME/MD/AD (census-cross-section
  # rows: 413/221/61/92 country cells). The asymmetry is the
  # registration's own shape, never "corrected". As on the birth face the
  # priorities are nominal (rows disjoint by destination, arbitration
  # never fires across them); the merge key (destination, origin, year,
  # sex) lives in its own layer — bilateral_citizenship, PARALLEL to the
  # birth face's bilateral layer, never merged with it (ADR-0010). The
  # FR row answers 127 country origins on this face (FR<-MA ctz 2015-2018
  # = 458,561/465,230/472,843/480,600 — the v18 anchor disambiguation,
  # re-verified live 2026-09-25; the identity codes ride the shared
  # override tables: AN->ANT the withdrawn Antillean code, XK->XKX
  # Kosovo's user-assigned code, EL/UK the Eurostat spellings).
  - provider: eurostat
    ref: migr_pop1ctz/ROW/BE
    priority: 34
    role: canonical
    unit: persons
    root: eurostat_migr
