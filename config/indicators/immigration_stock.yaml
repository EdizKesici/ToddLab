id: immigration_stock
label: "Immigrant stock (foreign-born population)"
family: demography
unit: persons
higher_is_better: false
todd_core: true

sources:
  # THE TWENTIETH INDICATOR (v18) — 11 citations, 1 book (Le Destin des
  # immigrés, Todd's immigrant-origin boards: "Maghreb, Turkish,
  # Portuguese populations — France/UK/Germany 1946-1990 (+ 4
  # distribution maps)", the official censuses). The metric of the
  # book that made the by-origin question THE Todd question.
  #
  # Canonical = Eurostat migr_pop3ctb/FOR/TOTAL/T — the migration
  # questionnaire's own stock table ("Population on 1 January by age
  # group, sex and country of birth"), pinned c_birth=FOR ("Foreign
  # country"): the foreign-born stock each country's own registration
  # prints. FR's series is annual and census-aligned (2008 = 7,076,824
  # -> 2024 = 9,362,105, verified live 2026-09-21); the door's 45-geo
  # codelist (EU27_2020 + 44 countries incl. TR/UA/GE/AM/AZ/AD/MC —
  # RICHER than the LFS door's) is the collector universe.
  - provider: eurostat
    ref: migr_pop3ctb/FOR/TOTAL/T
    priority: 1
    role: canonical
    unit: persons
    root: eurostat_migr

  # THE WITNESS (worldwide): WB SM.POP.TOTL, "International migrant
  # stock, total" — the UN Population Division's Trends in
  # International Migrant Stock, DESA's compiled estimates of the
  # same foreign-born stock (census-based with estimation for missing
  # years), world 1990-2024, 5-year steps to 2015 then annual. The
  # pair's shape: FR 1990 = 5,890,023 on the witness (the DESA
  # estimate) riding beside the collector's 2008+ annual prints; the
  # two doors converge on the co-covered core (FR 2024: 9,186,757
  # DESA vs 9,362,105 collector — the estimation seam displayed, the
  # WPP relation).
  - provider: worldbank
    ref: SM.POP.TOTL
    priority: 2
    role: witness
    root: un_desa

  # THE BY-ORIGIN FACE (v22) — THE Todd question wired: the bilateral
  # (destination x origin) decomposition of the SAME stock, the shape
  # of Le Destin des immigrés' own boards ("the stock of Moroccans/
  # Turks/Portuguese IN France/Germany/UK"). Canonical = the 30
  # destination ROWS of migr_pop3ctb that PRINT the by-origin detail
  # (one geo-pinned ref each, c_birth UNPINNED = the by-birth codelist
  # as printed, 307 codes: 243 countries + the door's 64 aggregate/
  # summary codes, dropped logged per class; the diagonal
  # c_birth == geo — the native face — drops logged too). THE HONEST
  # COVERAGE LIMIT, verified live 2026-09-22: 14 of the codelist's 44
  # country geos print ONLY their totals on this face (DE, EL, MT, ME,
  # MD, MK, GE, AL, RS, UA, AD, MC, AM, AZ — Germany's row carries 184
  # cells, every one of them an aggregate or a FOR/NAT/TOTAL/UNK
  # summary code, ZERO country origins) — the registration's own honest
  # absence, the same class as Ukraine's zero cells on the FOR door;
  # those doors stay unwired, recorded here (the day they print, they
  # join). Each wired row is one destination's own registration, the
  # same collector judgment as the FOR door above — the priorities are
  # nominal (the rows are disjoint by destination, arbitration never
  # fires across them). The FR row answers 226 country origins
  # (FR<-MA 2015 = 954,742, FR<-DZ 2018 = 1,390,284, FR<-PT 2025 =
  # 599,492 — the Todd-board anchors, verified live 2026-09-22); the
  # Maghreb/Turkey slices ride the census rounds (1999/2005/2015-2018)
  # and STOP at 2018 for FR — the coverage cliff the dist carries
  # as-printed. The UK row prints 1998-2004 only (the honest
  # post-Brexit-era record on this table).
  - provider: eurostat
    ref: migr_pop3ctb/ROW/BE
    priority: 3
    role: canonical
    unit: persons
    root: eurostat_migr
