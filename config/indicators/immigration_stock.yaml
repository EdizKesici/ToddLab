  # THE BY-CITIZENSHIP WITNESS (v23): OECD DSD_MIG@DF_MIG, measure B15 —
  # "International migration database", the SAME questionnaire's LEGAL
  # face ("stocks of foreign population by nationality" — the flow's own
  # description, read live from the SDMX registry), REF_AREA x
  # CITIZENSHIP, both axes ISO3. THE ACCESS MIRROR of the B14 quirk
  # (verified live 2026-09-25): DSD_MIG@DF_MIG refuses the empty-key /all
  # download but SERVES the positional wildcard key '..A.B15.._Z._Z.PS' —
  # one 18.4 MB call, 216,120 data rows, FREQ=A/BIRTH_PLACE=_Z/
  # EDUCATION_LEV=_Z/UNIT_MEASURE=PS pinned and hard-verified per row.
  # The parser pins the SEX=_T frame (the 104,009 F rows drop logged —
  # the by-sex door, the V24 hook) and drops the origin residual
  # vocabulary logged per class (STLS/W/W_X/EEA/EU15/A4; the NAT/TOTAL/
  # UNK aggregate guard carries 0 rows live), while the vanished-entity
  # codes (XKV, ANT_F/CSK_F/SCG_F/SUN_F/YUG_F) ride the shared override
  # table onto their withdrawn ISO3 entities — the same admission as the
  # birth face. THE SEAM, verified to the unit: OECD FR<-MAR _T 2015 =
  # 458,561 = the Eurostat migr_pop1ctz print EXACTLY (2016-2018:
  # 465,230/472,843/480,600 both sides); the world face the Eurostat
  # universe cannot print: US<-MEX 2024 = 8,226,106 (citizenship) vs
  # 12,383,868 (birth) — the two faces diverging naturally on the pair
  # the naturalization gap widens.
  - provider: oecd
    ref: DF_MIG/B15
    priority: 68
    role: witness
    unit: persons
    root: oecd_mig
  # THE BY-SEX FACE (v24) — the ventilations of the SAME rows, Ediz's
  # approved direction: the M/F splits of the two questionnaires' matrices
  # wired on BOTH faces (birth and citizenship), riding the SAME bilateral
  # layers under the merge key's sex component ((destination, origin,
  # year, sex) — the v22 key's own fourth term, None until now). Verified
  # live 2026-09-25 (the v24 probe): M + F = the _T print to the unit on
  # every anchor (FR<-MA birth 2015: 479,354 + 475,388 = 954,742; ctz:
  # 231,893 + 226,668 = 458,561; FR<-PT both faces, 2018 likewise); the
  # M/F perimeter = the _T perimeter minus Croatia (HR prints the _T
  # by-origin detail but NO ventilation — the registration's own honest
  # absence, unwired, recorded here; the day it prints, its fetch fails
  # loudly). 29 birth M doors + 29 birth F doors + 33 ctz M doors + 33
  # ctz F doors = 124 doors, priorities 69-192.
  - provider: eurostat
    ref: migr_pop3ctb/ROW/BE/M
    priority: 69
    role: canonical
    unit: persons
    root: eurostat_migr
  - provider: eurostat
