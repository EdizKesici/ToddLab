  # THE BY-ORIGIN WITNESS (v22): OECD DSD_MIG_F@DF_MIG_POPF, "International
  # migration database - stocks of foreign-born population" — the OECD
  # migration questionnaire's own bilateral matrix (REF_AREA x
  # BIRTH_COUNTRY, both axes ISO3), the OECD-COMPILED face of the same
  # national registrations (the oecd_family relation). The door serves only
  # through the empty-key /all download (positional keys 404, verified
  # live); the parser pins the SEX=_T frame (the F rows drop logged — the
  # by-sex face recorded unwired) and drops the residual vocabulary
  # (W/W_X/EEA/EU15/A4/STLS) and the diagonal, logged per class. THE SEAM,
  # verified to the unit: OECD FR<-MAR _T 2015 = 954,742 = the Eurostat
  # c_birth print EXACTLY (2018 = 992,120 both sides) — agreement that
  # reads like confirmation unless the genealogy says both doors walk back
  # to the same national registrations. And the OECD face EXTENDS the
  # canonical universe: the FR Maghreb series 2019-2021 past the Eurostat
  # 2018 cutoff (FR<-MAR 2021 = 1,036,133), the vanished-entity origins
  # (CSK_F/SUN_F/YUG_F/ANT_F/SCG_F — the by-origin face of the v21
  # admission), and the world's non-European destinations the 45-geo
  # Eurostat codelist structurally cannot print (US<-MEX 12,383,868 in
  # 2024, US<-W 51,226,993 the World-total row the witness drops logged).
  - provider: oecd
    ref: DF_MIG_POPF
    priority: 33
    role: witness
    unit: persons
    root: oecd_mig

coverage_start: 1990
coverage_end: 2025

reliability: high
reliability_criteria: >
  Canonical tier = Eurostat migr_pop3ctb pinned c_birth=FOR (the
  foreign-born total — "Foreign country"), age=TOTAL, sex=T, unit=NR
  (the dataset's only unit, pinned and guarded): 44 countries
  (aggregates dropped logged), the door's own per-country starts
  (Ireland 2000, Italy/Lithuania/Spain 2002, France 2007 — the FR
  series annual 2007-2025, census-aligned) with the collector's
  b/e/p flags as-reported. Since v22 the SAME collector tier carries
  the by-origin face: the 44 geo-pinned ROW doors (c_birth open, the
  307-code by-birth codelist as printed; aggregates, the
  FOR/NAT/TOTAL/OTH/UNK/RNC summary codes and the native diagonal
  dropped logged per class), as each country's own registration
  prints it. Witness tiers = the UN DESA migrant-stock estimates via
  WDI (world 1990-2024, the total face) and — since v22, the
  by-origin face — the OECD migration questionnaire's foreign-born
  matrix (38 destinations x the BIRTH_COUNTRY codelist, SEX=_T;
  the two questionnaires agreeing to the unit on the co-covered
  core). Root pair eurostat_migr/un_desa/oecd_mig: the registrations,
  the compiled estimates of the same stock, and the OECD-compiled
  questionnaire answers — one estimation/compilation step apart each.
reclassification_sensitive: false

plausible_range:
  min: 0
  max: 60000000   # the world's largest foreign-born stocks print in the
                 # 50s of millions (US 2024 class; the by-origin US<-W
                 # World row rides the same head — dropped logged on the
                 # OECD door, the bound admits any per-origin print that
                 # remains); 60M admits that head while a unit error (a
                 # share, a rate, a flow) or a misload of the NAT/TOTAL
                 # c_birth doors flags immediately.

